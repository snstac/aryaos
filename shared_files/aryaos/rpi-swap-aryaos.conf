# Raspberry Pi OS Trixie replaced dphys-swapfile with rpi-swap. Its "auto"
# default currently selects zram+file, which creates a 2 GiB /var/swap backing
# file and periodically writes idle zram pages to the install media. AryaOS's
# flash-longevity contract is RAM-only swap, so select the file-free mechanism
# explicitly rather than relying on a default that may change again.
[Main]
Mechanism=zram
