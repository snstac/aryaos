# AryaOS time service (drop-in; the packaged chrony.conf provides pool/drift/rtc).
#
# Makes the box a time SERVER for its own networks and, when a GNSS receiver has a
# fix, a GPS-disciplined source — so a fielded unit hands out accurate time to the
# LAN / onboarding radios even with no internet. Which networks may query is scoped
# by the firewalld `ntp` service (opened on the AryaOS + hotspot zones), not here.

# GPS reference clock via gpsd's SHM segment (used only when gpsd has a fix).
refclock SHM 0 refid GPS precision 1e-1 offset 0.0 delay 0.2

# Serve time to clients (firewall scopes which networks can reach us).
allow

# Fall back to an orphan-mode local clock (stratum 10) so an isolated network
# can elect one holdover leader without claiming that the clock is trustworthy.
# GutCheck peer selection never accepts stratum-10 or unsynchronised nodes.
local stratum 10 orphan

# Ephemeral refclock directory, written by aryaos-time-pps when a GNSS PPS
# actually exists. It deliberately lives in /run: a refclock naming a device
# that is not present yet is a FATAL chronyd error, and a USB GPS enumerates
# after chrony starts. chronyd tolerates this directory being absent or empty.
confdir /run/chrony-aryaos

# GutCheck discovers qualified AryaOS NTP peers at runtime. Only NTP source
# directives live here, so chronyc can atomically reload them without restarting
# chronyd or persisting tactical addresses across a reboot.
sourcedir /run/chrony-aryaos/sources
