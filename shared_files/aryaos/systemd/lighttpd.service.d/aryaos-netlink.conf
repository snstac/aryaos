# Allow iproute2 "ip" (netlink) for portal CGI — base lighttpd unit restricts families.
# See: systemd RestrictAddressFamilies in /usr/lib/systemd/system/lighttpd.service
#
# SPDX-License-Identifier: Apache-2.0
# Copyright Sensors & Signals LLC https://www.snstac.com/

[Service]
RestrictAddressFamilies=AF_INET AF_INET6 AF_UNIX AF_NETLINK
# Raspberry Pi OS hardens lighttpd with PrivateDevices=yes.  Keep that
# isolation, but bind only the general-command mailbox into its device
# namespace so the status CGI can read get_throttled/measure_temp.  vcgencmd
# opens this character device read/write even for read-only firmware commands.
# The leading '-' keeps the unit portable to hosts where the Pi device is absent.
BindReadOnlyPaths=-/dev/vcio_gencmd
DeviceAllow=/dev/vcio_gencmd rw
