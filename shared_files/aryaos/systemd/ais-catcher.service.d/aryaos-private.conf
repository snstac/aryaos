# AryaOS: do not leak received AIS to an internet community feed, and do not
# crash-loop while the serial receiver is absent or not assigned yet.
[Service]
ExecCondition=/bin/sh -c 'test -n "$SERIAL_PORT" && test -e "$SERIAL_PORT"'
ExecStart=
ExecStart=/usr/bin/AIS-catcher -X off -u ${UDP_DEST_ADDR} ${UDP_DEST_PORT} -e ${SERIAL_BAUDRATE} ${SERIAL_PORT} -N ${HTTP_PORT}
