[Service]
# aryaos-multicast-links resolves "auto" into the addresses currently usable
# for multicast (including IPv4LL on a DHCP-less MANET).
EnvironmentFile=-/run/aryaos/multicast.env
Environment="LOCAL_HEALTH_COMMAND=/usr/bin/sudo -n /usr/local/sbin/aryaos-health --json"
Environment="DISCOVERY_ENABLED=1"
Environment="DISCOVERY_PRODUCT=AryaOS"
Environment="DISCOVERY_SERVICE_TYPE=_aryaos._tcp.local."
Environment="DISCOVERY_SERVICE_PORT=443"
Environment="DISCOVERY_ADMIN_URL=https://{fqdn}/admin/"
Environment="DISCOVERY_LANDING_URL=https://{fqdn}/"
Environment="DISCOVERY_PUBLIC_URL=https://{ip}/.well-known/gutcheck"
Environment="DISCOVERY_DETAIL_CMD=/usr/local/sbin/aryaos-cot-detail"
Environment="DISCOVERY_REMARKS_CMD=/usr/local/sbin/aryaos-lincot-remarks"
Environment="DISCOVERY_CACHE=/run/gutcheck/neighbors.json"
