[cotbridge]
DEBUG = false
CONNECT_RETRY_SLEEP = 5
CONNECT_RETRY_MAX_SLEEP = 15

[lane:site-output]
enabled = true
mode = forward
ingress_cot_url = udp+ro://127.0.0.1:28087
egress_cot_url = udp+wo://239.2.3.1:6969
PYTAK_NO_HELLO = true
