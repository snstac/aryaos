[Service]
# Keep the site-wide CoT/TLS settings after package upgrades. The vendor unit
# is replaced by dpkg, whereas a /etc/systemd/system drop-in survives.
EnvironmentFile=-/etc/aryaos/aryaos-config.txt
# Preserve Cockpit/per-service overrides: the later file wins for duplicate
# keys, matching the original image-time unit ordering.
EnvironmentFile=/etc/default/lincot
