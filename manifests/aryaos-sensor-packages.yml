---
# Single source of truth for the snstac sensor stack (image build + Ansible).
# Installed from the signed snstac apt repository — https://snstac.github.io/packages
# (built by snstac/packages from each product's latest GitHub Release, refreshed daily).
# Trust anchor vendored at shared_files/aryaos/snstac-packages/ (snstac.gpg + snstac.sources).
sensor_apt_packages:
  - pytak
  - takproto
  - python3-asyncinotify
  - aircot
  # ACARS RF decoder + CoT gateway. ACARSCOT >= 0.1.1 requires the resilient
  # PyTAK reconnect supervisor and keeps enrollment state under /var/lib.
  - acarsdec
  - acarscot
  - cotbridge
  - gpscot
  - adsbcot
  - aiscot
  - cockpit-aiscot
  - dronecot
  - sikw00fcot
  - lincot
  # Tactical identity discovery (CoT, DNS-SD/mDNS, and SSDP) plus health API.
  - gutcheck
  # aprscot imports aprslib.parsing. The deb used to not declare it, so aprscot
  # could not start at all (snstac/aprscot#19). Fixed and released: aprscot
  # 8.2.1 declares python3-aprslib, and it is in the apt repo. Kept explicit
  # anyway so an older pinned aprscot cannot silently install unusable.
  - python3-aprslib
  # gdlcot — CoT to GDL90: ForeFlight/EFB display of the TAK air picture.
  # NOTE: requires gdlcot indexed in the apt repo (snstac/packages PR #1) —
  # merge/publish that before building an image from this manifest.
  - gdlcot
  # cockpit-gps — live GNSS data from gpsd with spoof/jam integrity monitoring.
  - cockpit-gps
  # Cockpit is the AryaOS admin surface: every installed gateway ships its plugin.
  - cockpit-lincot
  - cockpit-aiscatcher
  - cockpit-dronecot
  - cockpit-cotbridge
  - cockpit-gpscot
  # cockpit-aryaos — the "AryaOS Site" page: site-wide COT_URL + TAK TLS certs.
  - cockpit-aryaos
# cockpit-adsbcot is installed by stage-adsbcot (same apt repo).
