  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

t);\n  --shadow-lg: 0 12px 32px color-mix(in srgb, #2d2b2b 22%, transparent);\n}\n\nbody {\n  background: var(--color-bg);\n  color: var(--color-text);\n  font-family: var(--font-body);\n}\nh1, h2, h3, h4 { font-family: var(--font-heading); font-weight: var(--font-heading-weight); }\n\n.grayscale{filter:grayscale(1) contrast(1.08)}\n\n/* ══════════════════════════════════════════════════════════════════════════\n   Components — built with the tokens above. Plain CSS\n   on plain HTML: no JavaScript, no build step. Each class is documented in\n   readme.md and demonstrated in foundations/ and components/.\n   ══════════════════════════════════════════════════════════════════════ */\n\n*, *::before, *::after { box-sizing: border-box; }\nbody { margin: 0; font-size: 15px; line-height: 1.55; font-weight: 400; }\nh1, h2, h3, h4, h5, h6 {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  line-height: 1.12; letter-spacing: -0.015em; margin: 0 0 var(--space-2);\n}\nh1 { font-size: 42px; }\nh2 { font-size: 32px; }\nh3 { font-size: 25px; }\nh4 { font-size: 20px; }\nh5 { font-size: 16px; }\nh6 { font-size: 13px; }\nh6 { letter-spacing: 0.08em; text-transform: uppercase; }\np { margin: 0 0 var(--space-3); }\na { color: var(--color-accent); text-underline-offset: 3px; }\nimg { display: block; max-width: 100%; }\nfigure { margin: 0; }\nfigcaption {\n  font-size: 11px; margin-top: var(--space-1);\n  color: color-mix(in srgb, var(--color-text) 55%, transparent);\n}\n.text-muted { color: color-mix(in srgb, var(--color-text) 55%, transparent); }\n:focus { outline: none; }\n:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }\n::selection { background: color-mix(in srgb, var(--color-accent) 30%, transparent); }\n\n/* — rules — */\n.hr {\n  height: 2px; border: 0; margin: var(--space-4) 0;\n  background: var(--color-divider);\n}\n\n/* — buttons — */\n.btn {\n  display: inline-flex; align-items: center; justify-content: center; gap: 6px;\n  cursor: pointer; text-decoration: none;\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 14px; line-height: 1.2; color: var(--color-text); /* matches the .input's 14px —\n     the pair sits side by side in sign-up rows */\n  background: transparent; border: 1px solid transparent;\n  padding: var(--space-2) calc(var(--space-3) * 1.2);\n  border-radius: var(--radius-md);\n}\n.btn svg { display: block; }\n.btn:disabled { opacity: 0.45; cursor: not-allowed; }\n.btn-primary { background: var(--color-accent); color: var(--color-bg); }\n.btn-primary:hover { background: var(--color-accent-600); }\n.btn-primary:active { background: var(--color-accent-700); }\n.btn-secondary { border-color: var(--color-divider); }\n.btn-secondary:hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }\n.btn-secondary:active { background: color-mix(in srgb, var(--color-text) 14%, transparent); }\n.btn-ghost { color: var(--color-accent); padding-inline: var(--space-1); }\n.btn-ghost:hover { background: color-mix(in srgb, var(--color-accent) 10%, transparent); }\n.btn-ghost:active { background: color-mix(in srgb, var(--color-accent) 18%, transparent); }\n.btn-icon { width: 36px; height: 36px; padding: 0; }\n.btn-block { width: 100%; margin-top: var(--space-2); justify-content: flex-start; text-align: left; }\n\n/* — forms — */\n.field > label {\n  display: block; font-size: 12px; margin-bottom: 5px;\n  color: color-mix(in srgb, var(--color-text) 70%, transparent);\n}\n.input {\n  width: 100%; min-height: 36px; padding: 6px 10px; font: inherit;\n  font-size: 14px; color: var(--color-text); caret-color: var(--color-accent);\n  background: var(--color-surface);\n  border: 1px solid var(--color-divider); border-radius: var(--radius-md);\n}\n.input:hover { border-color: color-mix(in srgb, var(--color-text) 45%, transparent); }\n.input:focus-visible { border-color: var(--color-accent); outline-offset: 0; }\ntextarea.input { min-height: 90px; resize: vertical; }\n.radio { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; font-size: 14px; }\n.radio input, .seg-opt input {\n  position: absolute; opacity: 0; width: 0; height: 0; pointer-events: none;\n}\n.radio .dot {\n  width: 16px; height: 16px; flex: none; border-radius: 50%;\n  border: 1.5px solid var(--color-divider);\n}\n.radio:hover .dot { border-color: var(--color-accent); }\n.radio input:checked + .dot {\n  border-color: var(--color-accent); background: var(--color-accent);\n  box-shadow: inset 0 0 0 4px var(--color-bg);\n}\n.radio input:focus-visible + .dot { outline: 2px solid var(--color-accent); outline-offset: 2px; }\n.seg {\n  display: inline-flex; overflow: hidden;\n  border: 1px solid var(--color-divider); border-radius: var(--radius-md);\n}\n.seg-opt {\n  display: inline-flex; align-items: center; gap: 6px;\n  padding: 7px 12px; font-size: 13px; cursor: pointer;\n}\n.seg-opt + .seg-opt { border-left: 1px solid var(--color-divider); }\n.seg-opt:has(input:checked) { background: var(--color-accent); color: var(--color-bg); }\n.seg-opt:not(:has(input:checked)):hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }\n.seg-opt:has(input:focus-visible) { outline: 2px solid var(--color-accent); outline-offset: -2px; }\n\n/* — cards — */\n.card {\n  display: flex; flex-direction: column; gap: var(--space-2);\n  padding: var(--space-3); border-radius: var(--radius-md); background: var(--color-surface);\n}\n.card-kicker { font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--color-accent); }\n.card-title {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 17px; line-height: 1.2;\n}\n.card-body { margin: 0; font-size: 13px; opacity: 0.8; flex: 1; }\n.card-meta {\n  display: flex; align-items: center; gap: 6px; font-size: 11px;\n  color: color-mix(in srgb, var(--color-text) 50%, transparent);\n}\n.elev-sm { box-shadow: var(--shadow-sm); }\n.elev-md { box-shadow: var(--shadow-md); }\n.elev-lg { box-shadow: var(--shadow-lg); }\n\n/* — tags — */\n.tag {\n  display: inline-flex; align-items: center; font-size: 11px;\n  letter-spacing: 0.02em; padding: 3px 10px;\n  border-radius: calc(var(--radius-md) * 0.75);\n}\n.tag-accent { background: var(--color-accent-100); color: var(--color-accent-800); }\n.tag-accent-2 { background: var(--color-accent-2-100); color: var(--color-accent-2-800); }\n.tag-neutral { background: var(--color-neutral-100); color: var(--color-neutral-800); }\n.tag-outline { border: 1px solid var(--color-accent); color: var(--color-accent); }\n\n/* — navigation — */\n.nav {\n  display: flex; align-items: center; gap: var(--space-4);\n  padding: var(--space-3) var(--space-4);\n  border-bottom: 2px solid var(--color-divider);\n}\n.nav-brand {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 18px; margin-right: auto;\n}\n.nav a { color: inherit; text-decoration: none; font-size: 14px; }\n.nav a:hover, .nav a[aria-current='page'] { color: var(--color-accent); }\n\n/* — tables — */\n.table { width: 100%; border-collapse: collapse; font-size: 14px; }\n.table th {\n  text-align: left; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase;\n  color: color-mix(in srgb, var(--color-text) 60%, transparent);\n  padding: var(--space-2); border-bottom: 2px solid var(--color-divider);\n}\n.table td {\n  padding: var(--space-2);\n  border-bottom: 1px solid var(--color-divider);\n}\n.table tbody tr:hover { background: color-mix(in srgb, var(--color-text) 4%, transparent); }\n\n/* — dialog — */\n.dialog-backdrop {\n  position: fixed; inset: 0; display: grid; place-items: center;\n  padding: var(--space-4);\n  background: color-mix(in srgb, var(--color-neutral-900) 50%, transparent);\n}\n.dialog {\n  width: min(440px, 100%); display: flex; flex-direction: column; gap: var(--space-3);\n  padding: var(--space-4); border-radius: var(--radius-lg); +2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n  <style>\n    body { margin:0; background:#F2EFE7; color:#12211A; font-family:'Archivo',sans-serif; -webkit-font-smoothing:antialiased; }\n    a { color:#12211A; text-decoration:underline; text-underline-offset:3px; text-decoration-thickness:2px; text-decoration-color:#E4610F; }\n    a:hover { color:#E4610F; }\n    ::selection { background:#E4610F; color:#F2EFE7; }\n  <\u002Fstyle>\n  \n<\u002Fhelmet>\n\n<div style=\"background:#F2EFE7; color:#12211A; font-family:'Archivo',sans-serif; max-width:1440px; margin:0 auto; overflow-x:clip\">\n\n  <div style=\"background:#0B1512; color:#F2EFE7; padding:72px 48px 56px 48px\">\n    <div style=\"display:flex; align-items:flex-start; gap:56px; flex-wrap:wrap\">\n      <div style=\"display:flex; flex-direction:column; gap:26px; flex:0 0 auto\">\n        <img src=\"7f64f8f4-01a3-429a-8176-0e5a4c2d1581\" alt=\"Signal Block\" style=\"width:200px; height:auto; display:block\">\n        <div style=\"font-family:'JetBrains Mono',monospace; font-weight:700; font-size:52px; line-height:1\"><span style=\"color:#E8A80F\">[<\u002Fspan>🔥<span style=\"color:#E8A80F\">]<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"flex:1 1 420px; min-width:320px\">\n        <div style=\"font-family:'Archivo Narrow',sans-serif; font-weight:600; font-size:11px; letter-spacing:0.16em; text-transform:uppercase; color:#8F9A93\">Sensors &amp; Signals LLC · Cross-program design guide · v1.0<\u002Fdiv>\n        <h1 style=\"font-size:64px; line-height:1.0; font-weight:800; letter-spacing:-0.035em; margin:18px 0 0 0\">AryaOS<br>Product Suite<\u002Fh1>\n        <div style=\"font-size:19px; line-height:1.5; max-width:640px; margin-top:22px; color:#C9D2CC\">Ten properties, two mark systems, one set of rules. Everything named <strong style=\"color:#F2EFE7\">Arya<\u002Fstrong> runs the Signal Block — <span style=\"font-family:'JetBrains Mono',monospace; font-size:17px\">-.-&nbsp;&nbsp;-.&nbsp;&nbsp;---&nbsp;&nbsp;.--<\u002Fspan>, KNOW in morse. Everything in the <strong style=\"color:#F2EFE7\">&amp;kit<\u002Fstrong> family runs a token in brackets. The grid, the type, the grounds and the voice are shared by all of them.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:flex; gap:2px; margin-top:56px; flex-wrap:wrap\">\n      <div style=\"height:10px; flex:1 1 60px; background:#E4610F\"><\u002Fdiv>\n      <div style=\"height:10px; flex:1 1 60px; background:#0FA8CE\"><\u002Fdiv>\n      <div style=\"height:10px; flex:1 1 60px; background:#7C52E8\"><\u002Fdiv>\n      <div style=\"height:10px; flex:1 1 60px; background:#1F5BD1\"><\u002Fdiv>\n      <div style=\"height:10px; flex:1 1 60px; background:#C4161C\"><\u002Fdiv>\n      <div style=\"height:10px; flex:1 1 60px; background:#D7FF3F\"><\u002Fdiv>\n      <div style=\"height:10px; flex:1 1 60px; background:#E8A80F\"><\u002Fdiv>\n      <div style=\"height:10px; flex:1 1 60px; background:#23C48E\"><\u002Fdiv>\n      <div style=\"height:10px; flex:1 1 60px; background:#CE2E86\"><\u002Fdiv>\n      <div style=\"height:10px; flex:1 1 60px; background:#0E9A94\"><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"display:flex; flex-wrap:wrap; gap:2px; background:#12211A; border-bottom:2px solid #12211A\">\n    <div style=\"background:#F2EFE7; padding:20px 24px; flex:1 1 220px; min-width:0\">\n      <div style=\"font-family:'Archivo Narrow',sans-serif; font-weight:600; font-size:10px; letter-spacing:0.18em; text-transform:uppercase; color:#6B7169\">Architecture<\u002Fdiv>\n      <div style=\"font-size:15px; font-weight:700; margin-top:6px\">Two families, shared rules<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"background:#F2EFE7; padding:20px 24px; flex:1 1 220px; min-width:0\">\n      <div style=\"font-family:'Archivo Narrow',sans-serif; font-weight:600; font-size:10px; letter-spacing:0.18em; text-transform:uppercase; color:#6B7169\">Grounds<\u002Fdiv>\n      <div style=\"font-size:15px; font-weight:700; margin-top:6px\">Console dark · paper light<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"background:#F2EFE7; padding:20px 24px; flex:1 1 220px; min-width:0\">\n      <div style=\"font-family:'Archivo Narrow',sans-serif; font-weight:600; font-size:10px; letter-spacing:0.18em; text-transform:uppercase; color:#6B7169\">Type<\u002Fdiv>\n      <div style=\"font-size:15px; font-weight:700; margin-top:6px\">Archivo · Narrow · JetBrains Mono<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"background:#F2EFE7; padding:20px 24px; flex:1 1 220px; min-width:0\">\n      <div style=\"font-family:'Archivo Narrow',sans-serif; font-weight:600; font-size:10px; letter-spacing:0.18em; text-transform:uppercase; color:#6B7169\">Unit<\u002Fdiv>\n      <div style=\"font-size:15px; font-weight:700; margin-top:6px\">8px · 2px rules · radius 0<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"padding:64px 48px; border-bottom:2px solid #12211A\">\n    <div style=\"font-family:'Archivo Narrow',sans-serif; font-weight:600; font-size:11px; letter-spacing:0.16em; text-transform:uppercase; color:#6B7169\">01 — The system in one sentence<\u002Fdiv>\n    <h2 style=\"font-size:40px; line-height:1.1; font-weight:800; letter-spacing:-0.025em; margin:14px 0 0 0; max-width:1000px\">The mark tells you which family. The one coloured element tells you which product.<\u002Fh2>\n    <div style=\"font-size:17px; line-height:1.55; max-width:820px; margin-top:20px; color:#2B342E\">Arya properties are boxes and the feeds they hear, so they carry the Signal Block and the accent sits in one cell — the opening dot of the <strong>W<\u002Fstrong>. &amp;kit properties are public-facing services, so they carry a bracketed token and the accent sits on the brackets. Two devices, one idea: a hard frame around one live element.<\u002Fdiv>\n\n    <div style=\"display:grid; grid-template-columns:repeat(auto-fit,minmax(min(340px,100%),1fr)); gap:2px; margin-top:44px; background:#12211A; border:2px solid #12211A\">\n      <div style=\"background:#F2EFE7; padding:40px\">\n        <div style=\"font-family:'Archivo Narrow',sans-serif; font-weight:600; font-size:10px; letter-spacing:0.18em; text-transform:uppercase; color:#6B7169\">Arya family — Signal Block<\u002Fdiv>\n        <div style=\"display:flex; gap:36px; margin-top:26px; flex-wrap:wrap; align-items:flex-end\">\n          <img src=\"7d636af4-8dc5-4a40-86eb-4d1076005b08\" alt=\"AryaOS mark\" style=\"width:104px; height:auto; display:block\">\n          <img src=\"5e5cfb84-f099-448e-a882-73144030b16a\" alt=\"AryaAir mark\" style=\"width:104px; height:auto; display:block\">\n          <img src=\"317d4de4-c04f-4e8a-be59-0e8378511c47\" alt=\"AryaUAS mark\" style=\"width:104px; height:auto; display:block\">\n          <img src=\"2832959e-a80c-4ad5-8602-69cc7d7a1b05\" alt=\"AryaSea mark\" style=\"width:104px; height:auto; display:block\">\n        <\u002Fdiv>\n        <div style=\"font-size:14px; line-height:1.55; margin-top:26px; color:#2B342E\">AryaOS · AryaAir · AryaUAS · AryaSea · DragonEgg. The geometry never changes — not the word, not the row lengths, not the grid. Only the accent cell moves colour.<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background:#0B0C0A; padding:40px\">\n        <div style=\"font-family:'JetBrains Mono',monospace; font-weight:700; font-size:10px; letter-spacing:0.2em; text-transform:uppercase; color:#9AA08F\">&amp;kit family — bracket glyph<\u002Fdiv>\n        <div style=\"display:flex; flex-direction:column; gap:16px; margin-top:26px; font-family:'JetBrains Mono',monospace; font-weight:700; font-size:34px; line-height:1\">\n          <div><span style=\"color:#6E7364\">[<\u002Fspan><span style=\"color:#F2F4EE\">&amp;<\u002Fspan><span style=\"color:#D7FF3F\">k<\u002Fspan><span style=\"color:#6E7364\">]<\u002Fspan><\u002Fdiv>\n          <div><span style=\"color:#0E9A94\">[<\u002Fspan><span style=\"color:#F2F4EE\">one<\u002Fspan><span style=\"color:#0E9A94\">]<\u002Fspan><\u002Fdiv>\n          <div><span style=\"color:#E8A80F\">[<\u002Fspan>🔥<span style=\"color:#E8A80F\">]<\u002Fspan><\u002Fdiv>\n          <div><span style=\"color:#23C48E\">[<\u002Fspan>📷<span style=\"color:#23C48E\">]<\u002Fspan><\u002Fdiv>\n          <div><span style=\"color:#CE2E86\">[<\u002Fspan><svg sc-camel-view-box=\"0 0 100 100\" style=\"height:0.86em; width:0.86em; vertical-align:-0.06em; display:inline-block\"><g stroke=\"#F2F4EE\" stroke-width=\"6\" fill=\"none\"><path d=\"M26 26 L74 74 M74 26 L26 74\"><\u002Fpath><circle cx=\"26\" cy=\"26\" r=\"18\"><\u002Fcircle><circle cx=\"74\" cy=\"26\" r=\"18\"><\u002Fcircle><circle cx=\"26\" cy=\"74\" r=\"18\"><\u002Fcircle><circle cx=\"74\" cy=\"74\" r=\"18\"><\u002Fcircle><\u002Fg><rect x=\"39\" y=\"39\" width=\"22\" height=\"22\" fill=\"#F2F4EE\"><\u002Frect><\u002Fsvg><span style=\"color:#CE2E86\">]<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"font-size:14px; line-height:1.55; margin-top:26px; color:#B9BFB6\">&amp;kit · FireCOP · Cambot · DroneCase. A glyph or a short word in brackets on a JetBrains Mono 700 advance. The brackets carry the accent; what sits inside carries the meaning.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"display:flex; flex-wrap:wrap; gap:2px; margin-top:2px; background:#12211A; border:2px solid #12211A; border-top:0\">\n      <div style=\"background:#EAE6DC; padding:24px 28px; flex:1 1 260px; min-width:0\">\n        <div style=\"font-size:15px; font-weight:800\">Never cross the devices<\u002Fdiv>\n        <div style=\"font-size:14px; line-height:1.5; margin-top:8px; color:#2B342E\">No Signal Block inside brackets. No bracket token on an Arya property. A property belongs to exactly one family and carries exactly one mark.<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background:#EAE6DC; padding:24px 28px; flex:1 1 260px; min-width:0\">\n        <div style=\"font-size:15px; font-weight:800\">One accent per surface<\u002Fdiv>\n        <div style=\"font-size:14px; line-height:1.5; margin-top:8px; color:#2B342E\">If you can see two product accents in one view, one of them is wrong. The exception is a launcher or an index, where accents act as identifiers.<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background:#EAE6DC; padding:24px 28px; flex:1 1 260px; min-width:0\">\n        <div style=\"font-size:15px; font-weight:800\">Everything else is shared<\u002Fdiv>\n        <div style=\"font-size:14px; line-height:1.5; margin-top:8px; color:#2B342E\">8px unit, 12 columns, 2px rules, radius 0, flush-left setting, mono-means-machine, 44px targets, and the voice in §10.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"padding:64px 48px; border-bottom:2px solid #12211A; background:#EAE6DC\">\n    <div style=\"font-family:'Archivo Narrow',sans-serif; font-weight:600; font-size:11px; letter-spacing:0.16em; text-transform:uppercase; color:#6B7169\">02 — The suite<\u002Fdiv>\n    <h2 style=\"font-size:40px; line-height:1.1; font-weight:800; letter-spacing:-0.025em; margin:14px 0 28px 0\">Ten properties<\u002Fh2>\n\n    <div style=\"border:2px solid #12211A; background:#12211A; display:flex; flex-direction:column; gap:2px\">\n      <div style=\"background:#12211A; color:#F2EFE7; display:grid; grid-template-columns:minmax(110px,170px) minmax(0,1fr) 84px minmax(0,190px); gap:24px; padding:12px 20px; font-family:'Archivo Narrow',sans-serif; font-weight:600; font-size:10px; letter-spacing:0.18em; text-transform:uppercase\">\n        <div>Property<\u002Fdiv><div>What it is<\u002Fdiv><div>Family<\u002Fdiv><div>Accent<\u002Fdiv>\n      <\u002Fdiv>\n      <sc-for list=\"{{ products }}\" as=\"p\" hint-placeholder-count=\"9\">\n        <div style=\"background:#F2EFE7; display:grid; grid-template-columns:minmax(110px,170px) minmax(0,1fr) 84px minmax(0,190px); gap:24px; padding:18px 20px; align-items:center\">\n          <div style=\"font-size:15px; font-weight:800\">{{ p.name }}<\u002Fdiv>\n          <div style=\"font-size:14px; line-height:1.45; color:#2B342E\">{{ p.line }}<\u002Fdiv>\n          <div style=\"font-family:'Archivo Narrow',sans-serif; font-weight:600; font-size:10px; letter-spacing:0.14em; text-transform:uppercase; color:#6B7169\">{{ p.family }}<\u002Fdiv>\n          <div style=\"display:flex; align-items:center; gap:10px\">\n            <div style=\"width:22px; height:22px; flex:0 0 auto; background:{{ p.accent }}\"><\u002Fdiv>\n            <div style=\"font-family:'JetBrains Mono',monospace; font-size:12px\">{{ p.accent }}<\u002Fdiv>\n            <div style=\"font-size:12px; color:#6B7169\">{{ p.accentName }}<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n\n    <div style=\"display:flex; flex-wrap:wrap; gap:2px; margin-top:2px; background:#12211A; border:2px solid #12211A; border-top:0\">\n      <div style=\"background:#F2EFE7; padding:22px; flex:1 1 230px; min-width:0\">\n        <div style=\"font-family:'Archivo Narrow',sans-serif; font-weight:600; font-size:10px; letter-spacing:0.18em; text-transform:uppercase; color:#6B7169\">Platform &amp; feeds<\u002Fdiv>\n        <div style=\"font-size:14px; line-height:1.5; margin-top:8px; color:#2B342E\">AryaOS is the box. Air, UAS and Sea are what it hears. They never appear without the platform behind them.<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background:#F2EFE7; padding:22px; flex:1 1 230px; min-width:0\">\n        <div style=\"font-family:'Archivo Narrow',sans-serif; font-weight:600; font-size:10px; letter-spacing:0.18em; text-transform:uppercase; color:#6B7169\">Red team<\u002Fdiv>\n        <div style=\"font-size:14px; line-height:1.5; margin-top:8px; color:#2B342E\">DragonEgg carries the Signal Block and nothing else from the light side. Its skin is deliberately harder — see §08.<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background:#F2EFE7; padding:22px; flex:1 1 230px; min-width:0\">\n        <div style=\"font-family:'Archivo Narrow',sans-serif; font-weight:600; font-size:10px; letter-spacing:0.18em; text-transform:uppercase; color:#6B7169\">Services<\u002Fdiv>\n        <div style=\"font-size:14px; line-height:1.5; margin-top:8px; color:#2B342E\">FireCOP, Cambot and DroneCase are where a team works. Console ground by default, accent reserved for live state.<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background:#F2EFE7; padding:22px; flex:1 1 230px; min-width:0\">\n        <div style=\"font-family:'Archivo Narrow',sans-serif; font-weight:600; font-size:10px; letter-spacing:0.18em; text-transform:uppercase; color:#6B7169\">Public<\u002Fdiv>\n        <div style=\"font-size:14px; line-height:1.5; margin-top:8px; color:#2B342E\">&amp;kit is open and unrestricted, and heads its own family. It should never look like a restricted system.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"padding:64px 48px; border-bottom:2px solid #12211A\">\n    <div style=\"font-family:'Archivo Narrow',sans-serif; font-weight:600; font-size:11px; letter-spacing:0.16em; text-transform:uppercase; color:#6B7169\">03 — Arya mark<\u002Fdiv>\n    <h2 style=\"font-size:40px; line-height:1.1; font-weight:800; letter-spacing:-0.025em; margin:14px 0 0 0\">Signal Block — construction<\u002Fh2>\n    <div style=\"font-size:17px; line-height:1.55; max-width:820px; margin-top:18px; color:#2B342E\">Four rows of morse set flush left as a ragged type block. Rows keep their true lengths — <strong>O<\u002Fstrong> overhangs, <strong>N<\u002Fstrong> falls short. Never pad a row to square the block up; the ragged right edge is the mark.<\u002Fdiv>\n\n    <div style=\"display:grid; grid-template-columns:repeat(auto-fit,minmax(min(340px,100%),1fr)); gap:2px; margin-top:40px; background:#12211A; border:2px solid #12211A\">\n      <div style=\"background:#FFFFFF; padding:48px; display:flex; align-items:center; justify-content:flex-start\">\n        <svg sc-camel-view-box=\"-6 -6 90 62\" style=\"width:100%; max-width:520px; height:auto; display:block\">\n          <defs>\n            <pattern id=\"g8\" width=\"8\" height=\"8\" sc-camel-pattern-units=\"userSpaceOnUse\">\n              <path d=\"M8 0 L0 0 0 8\" fill=\"none\" stroke=\"#CFCBC0\" stroke-width=\"0.4\"><\u002Fpath>\n            <\u002Fpattern>\n          <\u002Fdefs>\n          <rect x=\"-6\" y=\"-6\" width=\"90\" height=\"62\" fill=\"url(#g8)\" opacity=\"{{ gridOpacity }}\"><\u002Frect>\n          <rect x=\"-6\" y=\"-6\" width=\"90\" height=\"62\" fill=\"none\" stroke=\"#CFCBC0\" stroke-width=\"0.8\" stroke-dasharray=\"2 2\" opacity=\"{{ gridOpacity }}\"><\u002Frect>\n          <path fill=\"#12211A\" d=\"M0 0h22v8H0z M28 0h8v8h-8z M42 0h22v8H42z M0 14h22v8H0z M28 14h8v8h-8z M0 28h22v8H0z M28 28h22v8H28z M56 28h22v8H56z M14 42h22v8H14z M42 42h22v8H42z\"><\u002Fpath>\n          <rect x=\"0\" y=\"42\" width=\"8\" height=\"8\" fill=\"#E4610F\"><\u002Frect>\n        <\u002Fsvg>\n      <\u002Fdiv>\n      <div style=\"background:#F2EFE7; padding:40px\">\n        <div style=\"font-family:'Archivo Narrow',sans-serif; font-weight:600; font-size:10px; letter-spacing:0.18em; text-transform:uppercase; color:#6B7169\">Geometry — do not redraw by eye<\u002Fdiv>\n        <div style=\"margin-top:16px; font-size:14px; display:flex; flex-direction:column\">\n          <div style=\"display:flex; justify-content:space-between; gap:16px; padding:9px 0; border-bottom:1px solid #CFCBC0\"><span>One unit<\u002Fspan><span style=\"font-family:'JetBrains Mono',monospace\">8px at 100%<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex; justify-content:space-between; gap:16px; padding:9px 0; border-bottom:1px solid #CFCBC0\"><span>Dot<\u002Fspan><span style=\"font-family:'JetBrains Mono',monospace\">1 × 1 unit<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex; justify-content:space-between; gap:16px; padding:9px 0; border-bottom:1px solid #CFCBC0\"><span>Dash<\u002Fspan><span style=\"font-family:'JetBrains Mono',monospace\">2.75 × 1 unit<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex; justify-content:space-between; gap:16px; padding:9px 0; border-bottom:1px solid #CFCBC0\"><span>Element gap<\u002Fspan><span style=\"font-family:'JetBrains Mono',monospace\">0.75 unit<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex; justify-content:space-between; gap:16px; padding:9px 0; border-bottom:1px solid #CFCBC0\"><span>Row gap<\u002Fspan><span style=\"font-family:'JetBrains Mono',monospace\">0.75 unit<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex; justify-content:space-between; gap:16px; padding:9px 0; border-bottom:1px solid #CFCBC0\"><span>Block<\u002Fspan><span style=\"font-family:'JetBrains Mono',monospace\">9.75 × 6.25 units<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex; justify-content:space-between; gap:16px; padding:9px 0; border-bottom:1px solid #CFCBC0\"><span>Clear space<\u002Fspan><span style=\"font-family:'JetBrains Mono',monospace\">2 dot-widths<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex; justify-content:space-between; gap:16px; padding:9px 0\"><span>Corner radius<\u002Fspan><span style=\"font-family:'JetBrains Mono',monospace\">0 — always<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"margin-top:22px; padding-top:16px; border-top:2px solid #12211A; font-size:14px; line-height:1.5; color:#2B342E\">The accent cell is always the first element of row four — the <strong>W<\u002Fstrong>'s opening dot. One cell, one colour, one product.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"display:flex; flex-wrap:wrap; gap:2px; margin-top:2px; background:#12211A; border:2px solid #12211A; border-top:0\">\n      <div style=\"background:#F2EFE7; padding:32px 28px; flex:1 1 260px; min-width:0\">\n        <div style=\"font-family:'Archivo Narrow',sans-serif; font-weight:600; font-size:10px; letter-spacing:0.18em; text-transform:uppercase; color:#6B7169\">40px and up<\u002Fdiv>\n        <div style=\"margin-top:18px; display:flex; align-items:flex-end; gap:20px\">\n          <img src=\"7d636af4-8dc5-4a40-86eb-4d1076005b08\" alt=\"\" style=\"width:78px; height:auto; display:block\">\n          <img src=\"7d636af4-8dc5-4a40-86eb-4d1076005b08\" alt=\"\" style=\"width:52px; height:auto; display:block\">\n          <img src=\"7d636af4-8dc5-4a40-86eb-4d1076005b08\" alt=\"\" style=\"width:40px; height:auto; display:block\">\n        <\u002Fdiv>\n        <div style=\"font-size:13.5px; line-height:1.5; margin-top:18px; color:#2B342E\">Four rows, reading KNOW. The default everywhere.<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background:#F2EFE7; padding:32px 28px; flex:1 1 260px; min-width:0\">\n        <div style=\"font-family:'Archivo Narrow',sans-serif; font-weight:600; font-size:10px; letter-spacing:0.18em; text-transform:uppercase; color:#6B7169\">Below 40px<\u002Fdiv>\n        <div style=\"margin-top:18px; display:flex; align-items:flex-end; gap:20px\">\n          <svg sc-camel-view-box=\"0 0 78 22\" style=\"width:52px; height:auto; display:block\"><path fill=\"#12211A\" d=\"M0 0h22v8H0z M28 0h22v8H28z M56 0h22v8H56z M0 14h22v8H0z M42 14h22v8H42z\"><\u002Fpath><rect x=\"28\" y=\"14\" width=\"8\" height=\"8\" fill=\"#E4610F\"><\u002Frect><\u002Fsvg>\n          <svg sc-camel-view-box=\"0 0 78 22\" style=\"width:32px; height:auto; display:block\"><path fill=\"#12211A\" d=\"M0 0h22v8H0z M28 0h22v8H28z M56 0h22v8H56z M0 14h22v8H0z M42 14h22v8H42z\"><\u002Fpath><rect x=\"28\" y=\"14\" width=\"8\" height=\"8\" fill=\"#E4610F\"><\u002Frect><\u002Fsvg>\n        <\u002Fdiv>\n        <div style=\"font-size:13.5px; line-height:1.5; margin-top:18px; color:#2B342E\">The mark does not get clipped — it changes word. Two rows reading <strong>OK<\u002Fstrong>, <span style=\"font-family:'JetBrains Mono',monospace\">--- -.-<\u002Fspan>. Favicons, chips, silkscreen.<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background:#F2EFE7; padding:32px 28px; flex:1 1 260px; min-width:0\">\n        <div style=\"font-family:'Archivo Narrow',sans-serif; font-weight:600; font-size:10px; letter-spacing:0.18em; text-transform:uppercase; color:#6B7169\">One colour<\u002Fdiv>\n        <div style=\"margin-top:18px; display:flex; align-items:center; gap:2px; flex-wrap:wrap\">\n          <div style=\"background:#F2EFE7; border:2px solid #12211A; padding:14px\"><svg sc-camel-view-box=\"0 0 78 50\" style=\"width:60px; height:auto; display:block\"><path fill=\"#12211A\" d=\"M0 0h22v8H0z M28 0h8v8h-8z M42 0h22v8H42z M0 14h22v8H0z M28 14h8v8h-8z M0 28h22v8H0z M28 28h22v8H28z M56 28h22v8H56z M0 42h8v8H0z M14 42h22v8H14z M42 42h22v8H42z\"><\u002Fpath><\u002Fsvg><\u002Fdiv>\n          <div style=\"background:#12211A; padding:16px\"><svg sc-camel-view-box=\"0 0 78 50\" style=\"width:60px; height:auto; display:block\"><path fill=\"#F2EFE7\" d=\"M0 0h22v8H0z M28 0h8v8h-8z M42 0h22v8H42z M0 14h22v8H0z M28 14h8v8h-8z M0 28h22v8H0z M28 28h22v8H28z M56 28h22v8H56z M0 42h8v8H0z M14 42h22v8H14z M42 42h22v8H42z\"><\u002Fpath><\u002Fsvg><\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"font-size:13.5px; line-height:1.5; margin-top:18px; color:#2B342E\">Etch, embroidery, single-screen print. The accent cell goes solid with the rest — never knocked out.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"padding:64px 48px; border-bottom:2px solid #12211A; background:#0B0C0A; color:#F2F4EE\">\n    <div style=\"font-family:'JetBrains Mono',monospace; font-weight:700; font-size:11px; letter-spacing:0.2em; text-transform:uppercase; color:#9AA08F\">04 — &amp;kit mark<\u002Fdiv>\n    <h2 style=\"font-size:40px; line-height:1.1; font-weight:800; letter-spacing:-0.025em; margin:14px 0 0 0\">Bracket glyph — construction<\u002Fh2>\n    <div style=\"font-size:17px; line-height:1.55; max-width:820px; margin-top:18px; color:#B9BFB6\">One glyph — or one short lowercase word — in square brackets, set on a JetBrains Mono 700 advance. The brackets are the family and carry the product accent; the token inside is the product and stays neutral. Because it sits on a monospace advance, the token is measured in characters, not units — that is what keeps four different tokens optically identical.<\u002Fdiv>\n\n    <div style=\"display:grid; grid-template-columns:repeat(auto-fit,minmax(min(340px,100%),1fr)); gap:2px; margin-top:40px; background:#2A2C28; border:2px solid #2A2C28\">\n      <div style=\"background:#101210; padding:48px 40px; display:flex; align-items:center\">\n        <div style=\"font-family:'JetBrains Mono',monospace; font-weight:700; font-size:54px; line-height:1; position:relative; display:inline-block; border-left:2px solid #E8A80F; border-right:2px solid #E8A80F; padding:0 2px\">\n          <span style=\"color:#E8A80F\">[<\u002Fspan>🔥<span style=\"color:#E8A80F\">]<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background:#101210; padding:40px\">\n        <div style=\"font-family:'JetBrains Mono',monospace; font-weight:700; font-size:10px; letter-spacing:0.2em; text-transform:uppercase; color:#9AA08F\">Geometry<\u002Fdiv>\n        <div style=\"margin-top:16px; font-size:14px; display:flex; flex-direction:column; color:#F2F4EE\">\n          <div style=\"display:flex; justify-content:space-between; gap:16px; padding:9px 0; border-bottom:1px solid #2A2C28\"><span style=\"color:#B9BFB6\">Face<\u002Fspan><span style=\"font-family:'JetBrains Mono',monospace\">JetBrains Mono 700<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex; justify-content:space-between; gap:16px; padding:9px 0; border-bottom:1px solid #2A2C28\"><span style=\"color:#B9BFB6\">Tracking<\u002Fspan><span style=\"font-family:'JetBrains Mono',monospace\">0 — native advance<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex; justify-content:space-between; gap:16px; padding:9px 0; border-bottom:1px solid #2A2C28\"><span style=\"color:#B9BFB6\">Brackets<\u002Fspan><span style=\"font-family:'JetBrains Mono',monospace\">product accent<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex; justify-content:space-between; gap:16px; padding:9px 0; border-bottom:1px solid #2A2C28\"><span style=\"color:#B9BFB6\">Token<\u002Fspan><span style=\"font-family:'JetBrains Mono',monospace\">1 glyph or ≤4 characters<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex; justify-content:space-between; gap:16px; padding:9px 0; border-bottom:1px solid #2A2C28\"><span style=\"color:#B9BFB6\">Token colour<\u002Fspan><span style=\"font-family:'JetBrains Mono',monospace\">neutral, never accent<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex; justify-content:space-between; gap:16px; padding:9px 0; border-bottom:1px solid #2A2C28\"><span style=\"color:#B9BFB6\">Clear space<\u002Fspan><span style=\"font-family:'JetBrains Mono',monospace\">1 character<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex; justify-content:space-between; gap:16px; padding:9px 0\"><span style=\"color:#B9BFB6\">Radius<\u002Fspan><span style=\"font-family:'JetBrains Mono',monospace\">0 — always<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"margin-top:22px; padding-top:16px; border-top:2px solid #52564A; font-size:14px; line-height:1.5; color:#B9BFB6\">A word token is always lowercase — <span style=\"font-family:'JetBrains Mono',monospace; color:#F2F4EE\">[one]<\u002Fspan>, never <span style=\"font-family:'JetBrains Mono',monospace\">[One]<\u002Fspan> or <span style=\"font-family:'JetBrains Mono',monospace\">[ONE]<\u002Fspan>. &amp;kit's own token is the exception: it keeps its historic letter form <span style=\"font-family:'JetBrains Mono',monospace; color:#F2F4EE\">[&amp;k]<\u002Fspan>, which is where the device came from.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"display:flex; flex-wrap:wrap; gap:2px; margin-top:2px; background:#2A2C28; border:2px solid #2A2C28; border-top:0\">\n      <div style=\"background:#101210; padding:32px 28px; flex:1 1 260px; min-width:0\">\n        <div style=\"font-family:'JetBrains Mono',monospace; font-weight:700; font-size:10px; letter-spacing:0.2em; text-transform:uppercase; color:#9AA08F\">Glyph token<\u002Fdiv>\n        <div style=\"margin-top:20px; display:flex; flex-direction:column; gap:12px; font-family:'JetBrains Mono',monospace; font-weight:700; font-size:26px; line-height:1\">\n          <div><span style=\"color:#0E9A94\">[<\u002Fspan><span style=\"color:#F2F4EE\">one<\u002Fspan><span style=\"color:#0E9A94\">]<\u002Fspan><\u002Fdiv>\n          <div><span style=\"color:#E8A80F\">[<\u002Fspan>🔥<span style=\"color:#E8A80F\">]<\u002Fspan><\u002Fdiv>\n          <div><span style=\"color:#23C48E\">[<\u002Fspan>📷<span style=\"color:#23C48E\">]<\u002Fspan><\u002Fdiv>\n          <div><span style=\"color:#CE2E86\">[<\u002Fspan><svg sc-camel-view-box=\"0 0 100 100\" style=\"height:0.86em; width:0.86em; vertical-align:-0.06em; display:inline-block\"><g stroke=\"#F2F4EE\" stroke-width=\"6\" fill=\"none\"><path d=\"M26 26 L74 74 M74 26 L26 74\"><\u002Fpath><circle cx=\"26\" cy=\"26\" r=\"18\"><\u002Fcircle><circle cx=\"74\" cy=\"26\" r=\"18\"><\u002Fcircle><circle cx=\"26\" cy=\"74\" r=\"18\"><\u002Fcircle><circle cx=\"74\" cy=\"74\" r=\"18\"><\u002Fcircle><\u002Fg><rect x=\"39\" y=\"39\" width=\"22\" height=\"22\" fill=\"#F2F4EE\"><\u002Frect><\u002Fsvg><span style=\"color:#CE2E86\">]<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"font-size:13.5px; line-height:1.5; margin-top:20px; color:#B9BFB6\">The default at every size where the glyph reads cleanly — headers, splash, print, hardware.<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background:#101210; padding:32px 28px; flex:1 1 260px; min-width:0\">\n        <div style=\"font-family:'JetBrains Mono',monospace; font-weight:700; font-size:10px; letter-spacing:0.2em; text-transform:uppercase; color:#9AA08F\">Below 32px — short token<\u002Fdiv>\n        <div style=\"margin-top:20px; display:flex; flex-wrap:wrap; gap:14px; align-items:flex-end; font-family:'JetBrains Mono',monospace; font-weight:700; font-size:22px; line-height:1\">\n          <div><span style=\"color:#E8A80F\">[<\u002Fspan><span style=\"color:#F2F4EE\">fc<\u002Fspan><span style=\"color:#E8A80F\">]<\u002Fspan><\u002Fdiv>\n          <div><span style=\"color:#23C48E\">[<\u002Fspan><span style=\"color:#F2F4EE\">cb<\u002Fspan><span style=\"color:#23C48E\">]<\u002Fspan><\u002Fdiv>\n          <div><span style=\"color:#0E9A94\">[<\u002Fspan><span style=\"color:#F2F4EE\">oc<\u002Fspan><span style=\"color:#0E9A94\">]<\u002Fspan><\u002Fdiv>\n          <div><span style=\"color:#CE2E86\">[<\u002Fspan><span style=\"color:#F2F4EE\">dc<\u002Fspan><span style=\"color:#CE2E86\">]<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"font-size:13.5px; line-height:1.5; margin-top:20px; color:#B9BFB6\">Two letters in place of the glyph — the same move as KNOW collapsing to OK. Emoji turn to mud below 32px; word tokens crowd. Two letters do neither.<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background:#101210; padding:32px 28px; flex:1 1 260px; min-width:0\">\n        <div style=\"font-family:'JetBrains Mono',monospace; font-weight:700; font-size:10px; letter-spacing:0.2em; text-transform:uppercase; color:#9AA08F\">One colour<\u002Fdiv>\n        <div style=\"margin-top:20px; display:flex; gap:2px; align-items:stretch; flex-wrap:wrap\">\n          <div style=\"background:#0B0C0A; padding:18px 16px; font-family:'JetBrains Mono',monospace; font-weight:700; font-size:22px; color:#F2F4EE\">[<span style=\"filter:grayscale(1) brightness(2.4)\">🔥<\u002Fspan>]<\u002Fdiv>\n          <div style=\"background:#F2F4EE; padding:18px 16px; font-family:'JetBrains Mono',monospace; font-weight:700; font-size:22px; color:#0B0C0A\">[<span style=\"filter:grayscale(1) brightness(0.25)\">🔥<\u002Fspan>]<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"font-size:13.5px; line-height:1.5; margin-top:20px; color:#B9BFB6\">Brackets and glyph go one weight together, glyph as a monochrome silhouette. Never keep a colour emoji against one-colour brackets.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"display:flex; flex-wrap:wrap; gap:2px; margin-top:2px; background:#2A2C28; border:2px solid #2A2C28; border-top:0\">\n      <div style=\"background:#101210; padding:32px 28px; flex:1 1 300px; min-width:0\">\n        <div style=\"font-family:'JetBrains Mono',monospace; font-weight:700; font-size:10px; letter-spacing:0.2em; text-transform:uppercase; color:#9AA08F\">Word tokens — OneCOP<\u002Fdiv>\n        <div style=\"display:flex; gap:26px; margin-top:20px; align-items:flex-end; flex-wrap:wrap; font-family:'JetBrains Mono',monospace; font-weight:700; font-size:30px; line-height:1\">\n          <div><span style=\"color:#0E9A94\">[<\u002Fspan><span style=\"color:#F2F4EE\">one<\u002Fspan><span style=\"color:#0E9A94\">]<\u002Fspan><\u002Fdiv>\n          <div style=\"opacity:0.32\"><span style=\"color:#0E9A94\">[<\u002Fspan><span style=\"color:#F2F4EE\">1<\u002Fspan><span style=\"color:#0E9A94\">]<\u002Fspan><\u002Fdiv>\n          <div style=\"opacity:0.32\"><span style=\"color:#0E9A94\">[<\u002Fspan><span style=\"color:#F2F4EE\">I<\u002Fspan><span style=\"color:#0E9A94\">]<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"font-size:13.5px; line-height:1.55; margin-top:20px; color:#B9BFB6\">OneCOP takes <span style=\"font-family:'JetBrains Mono',monospace; color:#F2F4EE\">[one]<\u002Fspan>. The word is spoken, so the token is spoken — three characters, still one monospace measure wider than a glyph, and it reads at 16px where an emoji would not. <span style=\"font-family:'JetBrains Mono',monospace\">[1]<\u002Fspan> was the tidier construction and the colder read; <span style=\"font-family:'JetBrains Mono',monospace\">[I]<\u002Fspan> collides with the brackets at small sizes. A word token is the right call whenever the name <em>is<\u002Fem> the word.<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background:#101210; padding:32px 28px; flex:1 1 300px; min-width:0\">\n        <div style=\"font-family:'JetBrains Mono',monospace; font-weight:700; font-size:10px; letter-spacing:0.2em; text-transform:uppercase; color:#9AA08F\">Order of preference<\u002Fdiv>\n        <div style=\"margin-top:20px; font-size:14px; display:flex; flex-direction:column\">\n          <div style=\"display:flex; gap:16px; padding:10px 0; border-bottom:1px solid #2A2C28\"><span style=\"font-family:'JetBrains Mono',monospace; color:#9AA08F\">01<\u002Fspan><span style=\"color:#B9BFB6\">The word itself, if it is four characters or fewer — <span style=\"font-family:'JetBrains Mono',monospace; color:#F2F4EE\">[one]<\u002Fspan><\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex; gap:16px; padding:10px 0; border-bottom:1px solid #2A2C28\"><span style=\"font-family:'JetBrains Mono',monospace; color:#9AA08F\">02<\u002Fspan><span style=\"color:#B9BFB6\">A numeral or Unicode character that names the work — the flame, the camera<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex; gap:16px; padding:10px 0; border-bottom:1px solid #2A2C28\"><span style=\"font-family:'JetBrains Mono',monospace; color:#9AA08F\">03<\u002Fspan><span style=\"color:#B9BFB6\">A glyph drawn to the box, geometry only — the quadcopter<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex; gap:16px; padding:10px 0\"><span style=\"font-family:'JetBrains Mono',monospace; color:#9AA08F\">04<\u002Fspan><span style=\"color:#B9BFB6\">Two letters, as a last resort — <span style=\"font-family:'JetBrains Mono',monospace; color:#F2F4EE\">[oc]<\u002Fspan><\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"font-size:13.5px; line-height:1.55; margin-top:18px; color:#B9BFB6\">Each new property also claims one accent, checked against the ramp in §06 for a visible hue gap on both grounds. Ten is about the limit of comfort; past a dozen, accents stop working as identifiers and the family needs a second axis.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"display:grid; grid-template-columns:repeat(auto-fit,minmax(300px,1fr)); gap:32px; margin-top:28px; max-width:1100px\">\n      <div style=\"font-size:14px; line-height:1.55; color:#B9BFB6; border-top:2px solid #52564A; padding-top:14px\"><strong style=\"color:#F2F4EE\">Choosing a new token.<\u002Fstrong> One thing that names what the operator does — a glyph, a numeral, or a word of four characters or fewer. Never a logo, never two glyphs stacked to make a meaning. Where Unicode has no honest character, draw one on the 100-unit box at 6-unit stroke, as the DroneCase quadcopter is — geometry only, no illustration. If it needs a caption to be understood, it is the wrong token.<\u002Fdiv>\n      <div style=\"font-size:14px; line-height:1.55; color:#B9BFB6; border-top:2px solid #52564A; padding-top:14px\"><strong style=\"color:#F2F4EE\">Never do this.<\u002Fstrong> Nothing outside the brackets, nothing longer than four characters inside them. No third colour. No italic, no condensed substitute, no other monospace face for the brackets. Never recolour the token to the accent — the contrast between hard accent brackets and a neutral centre is the device.<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"padding:64px 48px; border-bottom:2px solid #12211A; background:#EAE6DC\">\n    <div style=\"font-family:'Archivo Narrow',sans-serif; font-weight:600; font-size:11px; letter-spacing:0.16em; text-transform:uppercase; color:#6B7169\">05 — Lockups<\u002Fdiv>\n    <h2 style=\"font-size:40px; line-height:1.1; font-weight:800; letter-spacing:-0.025em; margin:14px 0 0 0\">Mark plus name. Nothing else.<\u002Fh2>\n    <div style=\"font-size:17px; line-height:1.55; max-width:820px; margin-top:18px; color:#2B342E\">Both families lock up the same way: mark left, name right, one baseline, flush left. Names are Archivo 800 at −3% tracking. No tagline in the lockup, no descriptor line, no rule between mark and name.<\u002Fdiv>\n\n    <div style=\"display:flex; flex-wrap:wrap; gap:2px; margin-top:40px; background:#12211A; border:2px solid #12211A\">\n      <div style=\"background:#F2EFE7; padding:36px 32px; display:flex; align-items:center; gap:18px; flex:1 1 260px; min-width:0\">\n        <img src=\"7d636af4-8dc5-4a40-86eb-4d1076005b08\" alt=\"\" style=\"width:58px; height:auto; display:block; flex:0 0 auto\">\n        <div style=\"font-size:27px; font-weight:800; letter-spacing:-0.03em; line-height:1\">AryaOS<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background:#F2EFE7; padding:36px 32px; display:flex; align-items:center; gap:18px; flex:1 1 260px; min-width:0\">\n        <img src=\"5e5cfb84-f099-448e-a882-73144030b16a\" alt=\"\" style=\"width:58px; height:auto; display:block; flex:0 0 auto\">\n        <div style=\"font-size:27px; font-weight:800; letter-spacing:-0.03em; line-height:1\">AryaAir<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background:#F2EFE7; padding:36px 32px; display:flex; align-items:center; gap:18px; flex:1 1 260px; min-width:0\">\n        <img src=\"317d4de4-c04f-4e8a-be59-0e8378511c47\" alt=\"\" style=\"width:58px; height:auto; display:block; flex:0 0 auto\">\n        <div style=\"font-size:27px; font-weight:800; letter-spacing:-0.03em; line-height:1\">AryaUAS<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background:#F2EFE7; padding:36px 32px; display:flex; align-items:center; gap:18px; flex:1 1 260px; min-width:0\">\n        <img src=\"2832959e-a80c-4ad5-8602-69cc7d7a1b05\" alt=\"\" style=\"width:58px; height:auto; display:block; flex:0 0 auto\">\n        <div style=\"font-size:27px; font-weight:800; letter-spacing:-0.03em; line-height:1\">AryaSea<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background:#0B0C0A; padding:36px 32px; display:flex; align-items:center; gap:18px; flex:1 1 260px; min-width:0\">\n        <img src=\"12583052-4d59-447b-8ae1-d9382ad86580\" alt=\"\" style=\"width:58px; height:auto; display:block; flex:0 0 auto\">\n        <div style=\"font-size:27px; font-weight:800; letter-spacing:-0.03em; line-height:1; color:#F2EFE7\">DragonEgg<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background:#F2EFE7; padding:36px 32px; display:flex; align-items:center; gap:18px; flex:1 1 260px; min-width:0\">\n        <div style=\"font-family:'Archivo Narrow',sans-serif; font-weight:600; font-size:10px; letter-spacing:0.18em; text-transform:uppercase; color:#6B7169; line-height:1.5\">Arya family<br>Signal Block left,<br>name right<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"display:flex; flex-wrap:wrap; gap:2px; margin-top:2px; background:#2A2C28; border:2px solid #2A2C28; border-top:0\">\n      <div style=\"background:#0B0C0A; padding:36px 32px; display:flex; align-items:center; gap:16px; flex-wrap:wrap; min-width:0; flex:1 1 280px\">\n        <div style=\"font-family:'JetBrains Mono',monospace; font-weight:700; font-size:24px; line-height:1\"><span style=\"color:#0E9A94\">[<\u002Fspan><span style=\"color:#F2F4EE\">one<\u002Fspan><span style=\"color:#0E9A94\">]<\u002Fspan><\u002Fdiv>\n        <div style=\"font-size:25px; font-weight:800; letter-spacing:-0.03em; line-height:1; color:#F2F4EE\">OneCOP<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background:#0B0C0A; padding:36px 32px; display:flex; align-items:center; gap:16px; flex-wrap:wrap; min-width:0; flex:1 1 280px\">\n        <div style=\"font-family:'JetBrains Mono',monospace; font-weight:700; font-size:24px; line-height:1\"><span style=\"color:#E8A80F\">[<\u002Fspan>🔥<span style=\"color:#E8A80F\">]<\u002Fspan><\u002Fdiv>\n        <div style=\"font-size:25px; font-weight:800; letter-spacing:-0.03em; line-height:1; color:#F2F4EE\">FireCOP<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background:#0B0C0A; padding:36px 32px; display:flex; align-items:center; gap:16px; flex-wrap:wrap; min-width:0; flex:1 1 280px\">\n        <div style=\"font-family:'JetBrains Mono',monospace; font-weight:700; font-size:24px; line-height:1\"><span style=\"color:#23C48E\">[<\u002Fspan>📷<span style=\"color:#23C48E\">]<\u002Fspan><\u002Fdiv>\n        <div style=\"font-size:25px; font-weight:800; letter-spacing:-0.03em; line-height:1; color:#F2F4EE\">Cambot<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background:#0B0C0A; padding:36px 32px; display:flex; align-items:center; gap:16px; flex-wrap:wrap; min-width:0; flex:1 1 280px\">\n        <div style=\"font-family:'JetBrains Mono',monospace; font-weight:700; font-size:24px; line-height:1\"><span style=\"color:#CE2E86\">[<\u002Fspan><svg sc-camel-view-box=\"0 0 100 100\" style=\"height:0.86em; width:0.86em; vertical-align:-0.06em; display:inline-block\"><g stroke=\"#F2F4EE\" stroke-width=\"6\" fill=\"none\"><path d=\"M26 26 L74 74 M74 26 L26 74\"><\u002Fpath><circle cx=\"26\" cy=\"26\" r=\"18\"><\u002Fcircle><circle cx=\"74\" cy=\"26\" r=\"18\"><\u002Fcircle><circle cx=\"26\" cy=\"74\" r=\"18\"><\u002Fcircle><circle cx=\"74\" cy=\"74\" r=\"18\"><\u002Fcircle><\u002Fg><rect x=\"39\" y=\"39\" width=\"22\" height=\"22\" fill=\"#F2F4EE\"><\u002Frect><\u002Fsvg><span style=\"color:#CE2E86\">]<\u002Fspan><\u002Fdiv>\n        <div style=\"font-size:25px; font-weight:800; letter-spacing:-0.03em; line-height:1; color:#F2F4EE\">DroneCase<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"margin-top:28px; display:grid; grid-template-columns:repeat(auto-fit,minmax(260px,1fr)); gap:32px; max-width:1200px\">\n      <div style=\"font-size:14px; line-height:1.55; color:#2B342E; border-top:2px solid #12211A; padding-top:14px\"><strong>Endorsement.<\u002Fstrong> Where provenance matters — spec sheets, proposals, hardware labels — set <span style=\"font-family:'JetBrains Mono',monospace; font-size:13px\">{{ endorsement }}<\u002Fspan> in Archivo Narrow 600, 10px, 0.18em, slate, on its own line beneath the lockup. Never inside it.<\u002Fdiv>\n      <div style=\"font-size:14px; line-height:1.55; color:#2B342E; border-top:2px solid #12211A; padding-top:14px\"><strong>Stacked.<\u002Fstrong> Narrow columns, stickers and patches take the mark above the name, both flush left. The stacked lockup is never centred, even on a round patch.<\u002Fdiv>\n      <div style=\"font-size:14px; line-height:1.55; color:#2B342E; border-top:2px solid #12211A; padding-top:14px\"><strong>Token alone.<\u002Fstrong> An &amp;kit-family token may stand without its name once the surface is unambiguous — inside the app, on a tab, on a case label. An Arya Signal Block may not: it is the same block for all five.<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"padding:64px 48px; border-bottom:2px solid #12211A\">\n    <div style=\"font-family:'Archivo Narrow',sans-serif; font-weight:600; font-size:11px; letter-spacing:0.16em; text-transform:uppercase; color:#6B7169\">06 — Colour<\u002Fdiv>\n    <h2 style=\"font-size:40px; line-height:1.1; font-weight:800; letter-spacing:-0.025em; margin:14px 0 0 0\">A neutral core, one accent at a time<\u002Fh2>\n    <div style=\"font-size:17px; line-height:1.55; max-width:820px; margin-top:18px; color:#2B342E\">Roughly 70 ground · 25 ink and green · 5 accent. The core is shared by all nine properties; only the accent moves. Arya properties sit on the warm paper/console pair, &amp;kit properties on the cooler near-black pair — that difference is deliberate and should not be normalised away.<\u002Fdiv>\n\n    <div style=\"font-family:'Archivo Narrow',sans-serif; font-weight:600; font-size:10px; letter-spacing:0.18em; text-transform:uppercase; color:#6B7169; margin-top:44px\">Core<\u002Fdiv>\n    <div style=\"display:flex; flex-wrap:wrap; gap:2px; margin-top:12px; background:#12211A; border:2px solid #12211A\">\n      <div style=\"background:#F2EFE7; flex:1 1 120px; min-width:0\">\n        <div style=\"height:96px; background:#12211A\"><\u002Fdiv>\n        <div style=\"padding:14px 14px\"><div style=\"font-size:13.5px; font-weight:700\">Ink<\u002Fdiv><div style=\"font-family:'JetBrains Mono',monospace; font-size:11px; color:#6B7169; margin-top:3px\">#12211A<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background:#F2EFE7; flex:1 1 120px; min-width:0\">\n        <div style=\"height:96px; background:#1D4634\"><\u002Fdiv>\n        <div style=\"padding:14px 14px\"><div style=\"font-size:13.5px; font-weight:700\">Field Green<\u002Fdiv><div style=\"font-family:'JetBrains Mono',monospace; font-size:11px; color:#6B7169; margin-top:3px\">#1D4634<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background:#F2EFE7; flex:1 1 120px; min-width:0\">\n        <div style=\"height:96px; background:#0B1512\"><\u002Fdiv>\n        <div style=\"padding:14px 14px\"><div style=\"font-size:13.5px; font-weight:700\">Console<\u002Fdiv><div style=\"font-family:'JetBrains Mono',monospace; font-size:11px; color:#6B7169; margin-top:3px\">#0B1512<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background:#F2EFE7; flex:1 1 120px; min-width:0\">\n        <div style=\"height:96px; background:#F2EFE7; border-bottom:2px solid #12211A\"><\u002Fdiv>\n        <div style=\"padding:14px 14px\"><div style=\"font-size:13.5px; font-weight:700\">Paper<\u002Fdiv><div style=\"font-family:'JetBrains Mono',monospace; font-size:11px; color:#6B7169; margin-top:3px\">#F2EFE7<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background:#F2EFE7; flex:1 1 120px; min-width:0\">\n        <div style=\"height:96px; background:#6B7169\"><\u002Fdiv>\n        <div style=\"padding:14px 14px\"><div style=\"font-size:13.5px; font-weight:700\">Slate<\u002Fdiv><div style=\"font-family:'JetBrains Mono',monospace; font-size:11px; color:#6B7169; margin-top:3px\">#6B7169<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background:#F2EFE7; flex:1 1 120px; min-width:0\">\n        <div style=\"height:96px; background:#CFCBC0\"><\u002Fdiv>\n        <div style=\"padding:14px 14px\"><div style=\"font-size:13.5px; font-weight:700\">Hairline<\u002Fdiv><div style=\"font-family:'JetBrains Mono',monospace; font-size:11px; color:#6B7169; margin-top:3px\">#CFCBC0<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background:#F2EFE7; flex:1 1 120px; min-width:0\">\n        <div style=\"height:96px; background:#0B0C0A\"><\u002Fdiv>\n        <div style=\"padding:14px 14px\"><div style=\"font-size:13.5px; font-weight:700\">&amp;kit Ink<\u002Fdiv><div style=\"font-family:'JetBrains Mono',monospace; font-size:11px; color:#6B7169; margin-top:3px\">#0B0C0A<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background:#F2EFE7; flex:1 1 120px; min-width:0\">\n        <div style=\"height:96px; background:#52564A\"><\u002Fdiv>\n        <div style=\"padding:14px 14px\"><div style=\"font-size:13.5px; font-weight:700\">Bracket<\u002Fdiv><div style=\"font-family:'JetBrains Mono',monospace; font-size:11px; color:#6B7169; margin-top:3px\">#52564A<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"font-family:'Archivo Narrow',sans-serif; font-weight:600; font-size:10px; letter-spacing:0.18em; text-transform:uppercase; color:#6B7169; margin-top:44px\">Accents — one per property, never mixed<\u002Fdiv>\n    <div style=\"display:flex; flex-wrap:wrap; gap:2px; margin-top:12px; background:#12211A; border:2px solid #12211A\">\n      <sc-for list=\"{{ products }}\" as=\"p\" hint-placeholder-count=\"9\">\n        <div style=\"background:#F2EFE7; flex:1 1 120px; min-width:0\">\n          <div style=\"height:110px; background:{{ p.accent }}\"><\u002Fdiv>\n          <div style=\"padding:12px 12px 16px 12px\">\n            <div style=\"font-size:13px; font-weight:800; line-height:1.2\">{{ p.name }}<\u002Fdiv>\n            <div style=\"font-size:11.5px; color:#6B7169; margin-top:4px; line-height:1.3\">{{ p.accentName }}<\u002Fdiv>\n            <div style=\"font-family:'JetBrains Mono',monospace; font-size:11px; color:#12211A; margin-top:6px\">{{ p.accent }}<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n\n    <div style=\"display:grid; grid-template-columns:repeat(auto-fit,minmax(min(320px,100%),1fr)); gap:2px; margin-top:2px; background:#12211A; border:2px solid #12211A; border-top:0\">\n      <div style=\"background:#F2EFE7; padding:28px\">\n        <div style=\"font-family:'Archivo Narrow',sans-serif; font-weight:600; font-size:10px; letter-spacing:0.18em; text-transform:uppercase; color:#6B7169\">Status is not brand<\u002Fdiv>\n        <div style=\"display:flex; gap:24px; margin-top:16px; flex-wrap:wrap\">\n          <div style=\"display:flex; align-items:center; gap:9px\"><div style=\"width:14px; height:14px; background:#3F7D57\"><\u002Fdiv><span style=\"font-family:'JetBrains Mono',monospace; font-size:12.5px\">#3F7D57 OK<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex; align-items:center; gap:9px\"><div style=\"width:14px; height:14px; background:#A8811C\"><\u002Fdiv><span style=\"font-family:'JetBrains Mono',monospace; font-size:12.5px\">#A8811C WARN<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex; align-items:center; gap:9px\"><div style=\"width:14px; height:14px; background:#A32820\"><\u002Fdiv><span style=\"font-family:'JetBrains Mono',monospace; font-size:12.5px\">#A32820 FAULT<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"font-size:14px; line-height:1.55; margin-top:16px; color:#2B342E\">Status colours are deliberately low-chroma so they can never be mistaken for a product accent, and they always carry a text label beside them. Brand accents are high-chroma; status is muted. Do not raise the saturation of a status colour to make it \"pop\".<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background:#F2EFE7; padding:28px\">\n        <div style=\"font-family:'Archivo Narrow',sans-serif; font-weight:600; font-size:10px; letter-spacing:0.18em; text-transform:uppercase; color:#6B7169\">Contrast<\u002Fdiv>\n        <div style=\"font-size:14px; line-height:1.55; margin-top:16px; color:#2B342E\">Accents clear 3:1 on both grounds — headings, rules, icons and interface chrome only, never body copy. For paragraph-size text in a product accent, drop to the deep step of that hue. Ink on paper and paper on console both clear 12:1; those are the only pairs used for reading.<\u002Fdiv>\n        <div style=\"display:flex; gap:2px; margin-top:16px\">\n          <div style=\"flex:1; background:#0B1512; color:#F2EFE7; padding:14px; font-size:13px\">Paper on console — reading<\u002Fdiv>\n          <div style=\"flex:1; background:#F2EFE7; color:#12211A; padding:14px; font-size:13px; border:2px solid #12211A\">Ink on paper — reading<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"padding:64px 48px; border-bottom:2px solid #12211A; background:#EAE6DC\">\n    <div style=\"font-family:'Archivo Narrow',sans-serif; font-weight:600; font-size:11px; letter-spacing:0.16em; text-transform:uppercase; color:#6B7169\">07 — Type, grid and grounds<\u002Fdiv>\n    <h2 style=\"font-size:40px; line-height:1.1; font-weight:800; letter-spacing:-0.025em; margin:14px 0 0 0\">Three faces, one unit<\u002Fh2>\n\n    <div style=\"display:grid; grid-template-columns:repeat(auto-fit,minmax(min(340px,100%),1fr)); gap:2px; margin-top:36px; background:#12211A; border:2px solid #12211A\">\n      <div style=\"background:#F2EFE7; padding:40px\">\n        <div style=\"font-size:52px; font-weight:800; letter-spacing:-0.03em; line-height:1.05\">Sensors in.<br>Cursor on Target out.<\u002Fdiv>\n        <div style=\"font-family:'Archivo Narrow',sans-serif; font-weight:600; font-size:10px; letter-spacing:0.18em; text-transform:uppercase; color:#6B7169; margin-top:8px\">Display · Archivo 800 · 52px · −3%<\u002Fdiv>\n        <div style=\"height:2px; background:#12211A; margin:26px 0\"><\u002Fdiv>\n        <div style=\"font-size:32px; font-weight:700; letter-spacing:-0.02em\">Section heading
