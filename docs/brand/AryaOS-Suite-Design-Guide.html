<\u002Fdiv>\n        <div style=\"font-family:'Archivo Narrow',sans-serif; font-weight:600; font-size:10px; letter-spacing:0.18em; text-transform:uppercase; color:#6B7169; margin-top:6px\">Archivo 700 · 32px · −2%<\u002Fdiv>\n        <div style=\"height:2px; background:#12211A; margin:26px 0\"><\u002Fdiv>\n        <div style=\"font-size:16px; line-height:1.56; max-width:68ch\">Body copy is Archivo 400 at 16px, 1.56 leading, measure capped at 68 characters. Set flush left with a ragged right edge — never justified, never centred, never hyphenated.<\u002Fdiv>\n        <div style=\"font-family:'Archivo Narrow',sans-serif; font-weight:600; font-size:10px; letter-spacing:0.18em; text-transform:uppercase; color:#6B7169; margin-top:8px\">Body · Archivo 400 · 16 / 1.56 · 68ch<\u002Fdiv>\n        <div style=\"height:2px; background:#12211A; margin:26px 0\"><\u002Fdiv>\n        <div style=\"font-family:'JetBrains Mono',monospace; font-size:13.5px; line-height:1.6\">aryaos-ctl status --sensor adsb<br>1090.000 MHz · 44 tracks · GDL90 :4000<\u002Fdiv>\n        <div style=\"font-family:'Archivo Narrow',sans-serif; font-weight:600; font-size:10px; letter-spacing:0.18em; text-transform:uppercase; color:#6B7169; margin-top:8px\">Mono · anything the box itself said — and every bracket token<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background:#F2EFE7; padding:40px\">\n        <div style=\"font-family:'Archivo Narrow',sans-serif; font-weight:600; font-size:10px; letter-spacing:0.18em; text-transform:uppercase; color:#6B7169\">Rules<\u002Fdiv>\n        <div style=\"display:flex; flex-direction:column; gap:14px; margin-top:16px; font-size:14px; line-height:1.5; color:#2B342E\">\n          <div><strong>Flush left, always.<\u002Fstrong> Headings, copy, and the label inside a wide button.<\u002Fdiv>\n          <div><strong>Narrow is for labels only.<\u002Fstrong> 10–13px, uppercase, 0.18em tracking. Never a sentence.<\u002Fdiv>\n          <div><strong>Mono means machine.<\u002Fstrong> Commands, ports, frequencies, callsigns, hex, morse, bracket tokens.<\u002Fdiv>\n          <div><strong>Two sizes per screen.<\u002Fstrong> A heading and a body. A third needs a reason.<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"height:2px; background:#12211A; margin:26px 0\"><\u002Fdiv>\n        <div style=\"font-family:'Archivo Narrow',sans-serif; font-weight:600; font-size:10px; letter-spacing:0.18em; text-transform:uppercase; color:#6B7169\">Grid<\u002Fdiv>\n        <div style=\"margin-top:16px; font-size:14px; display:flex; flex-direction:column\">\n          <div style=\"display:flex; justify-content:space-between; padding:8px 0; border-bottom:1px solid #CFCBC0\"><span>Columns<\u002Fspan><span style=\"font-family:'JetBrains Mono',monospace\">12<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex; justify-content:space-between; padding:8px 0; border-bottom:1px solid #CFCBC0\"><span>Base unit<\u002Fspan><span style=\"font-family:'JetBrains Mono',monospace\">8px<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex; justify-content:space-between; padding:8px 0; border-bottom:1px solid #CFCBC0\"><span>Gutter<\u002Fspan><span style=\"font-family:'JetBrains Mono',monospace\">24px<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex; justify-content:space-between; padding:8px 0; border-bottom:1px solid #CFCBC0\"><span>Rule<\u002Fspan><span style=\"font-family:'JetBrains Mono',monospace\">2px ink<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex; justify-content:space-between; padding:8px 0; border-bottom:1px solid #CFCBC0\"><span>Panel gap<\u002Fspan><span style=\"font-family:'JetBrains Mono',monospace\">2px, ink shows<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex; justify-content:space-between; padding:8px 0; border-bottom:1px solid #CFCBC0\"><span>Hit target<\u002Fspan><span style=\"font-family:'JetBrains Mono',monospace\">44px<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex; justify-content:space-between; padding:8px 0\"><span>Radius<\u002Fspan><span style=\"font-family:'JetBrains Mono',monospace\">0<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"margin-top:22px; padding-top:16px; border-top:2px solid #12211A; font-size:14px; line-height:1.5; color:#2B342E\">Icons are Lucide at 2px stroke, square caps, no fill. Shadows are never used — a 2px rule does the separating.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"font-family:'Archivo Narrow',sans-serif; font-weight:600; font-size:10px; letter-spacing:0.18em; text-transform:uppercase; color:#6B7169; margin-top:44px\">Dual ground — the same panel, both ways<\u002Fdiv>\n    <div style=\"display:grid; grid-template-columns:repeat(auto-fit,minmax(min(320px,100%),1fr)); gap:2px; margin-top:12px; background:#12211A; border:2px solid #12211A\">\n      <div style=\"background:#0B0C0A; padding:0\">\n        <div style=\"display:flex; align-items:center; gap:12px; padding:14px 20px; border-bottom:2px solid #2A2C28\">\n          <div style=\"font-family:'JetBrains Mono',monospace; font-weight:700; font-size:16px; line-height:1\"><span style=\"color:#E8A80F\">[<\u002Fspan>🔥<span style=\"color:#E8A80F\">]<\u002Fspan><\u002Fdiv>\n          <div style=\"font-size:15px; font-weight:800; color:#F2F4EE; letter-spacing:-0.02em\">FireCOP<\u002Fdiv>\n          <div style=\"margin-left:auto; font-family:'Archivo Narrow',sans-serif; font-weight:600; font-size:10px; letter-spacing:0.18em; text-transform:uppercase; color:#8F9A93\">Console<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"padding:24px 20px\">\n          <div style=\"display:flex; align-items:center; gap:10px\"><div style=\"width:10px; height:10px; background:#3F7D57\"><\u002Fdiv><span style=\"font-family:'JetBrains Mono',monospace; font-size:12.5px; color:#C9D2CC\">ADSB · 44 tracks · OK<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex; align-items:center; gap:10px; margin-top:10px\"><div style=\"width:10px; height:10px; background:#A8811C\"><\u002Fdiv><span style=\"font-family:'JetBrains Mono',monospace; font-size:12.5px; color:#C9D2CC\">AIS · no fix · WARN<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex; gap:2px; margin-top:22px\">\n            <div style=\"background:#E8A80F; color:#12211A; font-size:13px; font-weight:700; padding:13px 18px; min-height:44px; display:flex; align-items:center\">Start ingest<\u002Fdiv>\n            <div style=\"border:2px solid #3B4A43; color:#F2EFE7; font-size:13px; font-weight:700; padding:11px 18px; min-height:44px; display:flex; align-items:center\">Cancel<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background:#F2F4EE; padding:0\">\n        <div style=\"display:flex; align-items:center; gap:12px; padding:14px 20px; border-bottom:2px solid #0B0C0A\">\n          <div style=\"font-family:'JetBrains Mono',monospace; font-weight:700; font-size:16px; line-height:1\"><span style=\"color:#B37F06\">[<\u002Fspan>🔥<span style=\"color:#B37F06\">]<\u002Fspan><\u002Fdiv>\n          <div style=\"font-size:15px; font-weight:800; letter-spacing:-0.02em\">FireCOP<\u002Fdiv>\n          <div style=\"margin-left:auto; font-family:'Archivo Narrow',sans-serif; font-weight:600; font-size:10px; letter-spacing:0.18em; text-transform:uppercase; color:#6B7169\">Paper<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"padding:24px 20px\">\n          <div style=\"display:flex; align-items:center; gap:10px\"><div style=\"width:10px; height:10px; background:#3F7D57\"><\u002Fdiv><span style=\"font-family:'JetBrains Mono',monospace; font-size:12.5px; color:#2B342E\">ADSB · 44 tracks · OK<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex; align-items:center; gap:10px; margin-top:10px\"><div style=\"width:10px; height:10px; background:#A8811C\"><\u002Fdiv><span style=\"font-family:'JetBrains Mono',monospace; font-size:12.5px; color:#2B342E\">AIS · no fix · WARN<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex; gap:2px; margin-top:22px\">\n            <div style=\"background:#E8A80F; color:#12211A; font-size:13px; font-weight:700; padding:13px 18px; min-height:44px; display:flex; align-items:center\">Start ingest<\u002Fdiv>\n            <div style=\"border:2px solid #0B0C0A; font-size:13px; font-weight:700; padding:11px 18px; min-height:44px; display:flex; align-items:center\">Cancel<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"font-size:14px; line-height:1.55; max-width:900px; margin-top:16px; color:#2B342E\">Console dark is the default for anything an operator drives — FireCOP, Cambot, DroneCase, the AryaOS web admin. Paper is the default for anything printed or read — spec sheets, docs, proposals, labels. A property never mixes the two on one screen. On paper, an accent that fails 4.5:1 against the light ground steps down to its deep value, as the gold does above.<\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"padding:64px 48px; border-bottom:2px solid #C4161C; background:#0B0C0A; color:#F2EFE7\">\n    <div style=\"font-family:'JetBrains Mono',monospace; font-weight:700; font-size:11px; letter-spacing:0.22em; text-transform:uppercase; color:#C4161C\">08 — DragonEgg · red team alt-skin<\u002Fdiv>\n    <h2 style=\"font-size:40px; line-height:1.1; font-weight:800; letter-spacing:-0.025em; margin:14px 0 0 0\">The one that is supposed to look different<\u002Fh2>\n    <div style=\"font-size:17px; line-height:1.55; max-width:820px; margin-top:18px; color:#B9BFB6\">DragonEgg is adversary emulation. It runs the Signal Block and the same grid, and everything else is deliberately harder: near-black ground, crimson accent, mono for headings as well as machine output, stencilled labels. An operator should never confuse a DragonEgg surface with a blue-team one.<\u002Fdiv>\n\n    <div style=\"display:grid; grid-template-columns:repeat(auto-fit,minmax(min(340px,100%),1fr)); gap:2px; margin-top:40px; background:#2A2C28; border:2px solid #2A2C28\">\n      <div style=\"background:#0B0C0A; padding:40px; display:flex; flex-direction:column; gap:26px; align-items:flex-start\">\n        <img src=\"12583052-4d59-447b-8ae1-d9382ad86580\" alt=\"DragonEgg\" style=\"width:150px; height:auto; display:block\">\n        <div>\n          <div style=\"font-family:'JetBrains Mono',monospace; font-size:32px; font-weight:700; letter-spacing:-0.02em\">DragonEgg<\u002Fdiv>\n          <div style=\"font-family:'JetBrains Mono',monospace; font-weight:700; font-size:10px; letter-spacing:0.22em; text-transform:uppercase; color:#C4161C; margin-top:10px\">Adversary emulation · restricted<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background:#101210; padding:40px\">\n        <div style=\"font-family:'JetBrains Mono',monospace; font-weight:700; font-size:10px; letter-spacing:0.22em; text-transform:uppercase; color:#8B918A\">Skin deltas<\u002Fdiv>\n        <div style=\"margin-top:18px; font-size:14px; display:flex; flex-direction:column\">\n          <div style=\"display:flex; justify-content:space-between; gap:20px; padding:10px 0; border-bottom:1px solid #2A2C28\"><span style=\"color:#B9BFB6\">Ground<\u002Fspan><span style=\"font-family:'JetBrains Mono',monospace\">#0B0C0A<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex; justify-content:space-between; gap:20px; padding:10px 0; border-bottom:1px solid #2A2C28\"><span style=\"color:#B9BFB6\">Panel<\u002Fspan><span style=\"font-family:'JetBrains Mono',monospace\">#101210<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex; justify-content:space-between; gap:20px; padding:10px 0; border-bottom:1px solid #2A2C28\"><span style=\"color:#B9BFB6\">Accent<\u002Fspan><span style=\"font-family:'JetBrains Mono',monospace; color:#C4161C\">#C4161C<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex; justify-content:space-between; gap:20px; padding:10px 0; border-bottom:1px solid #2A2C28\"><span style=\"color:#B9BFB6\">Rule<\u002Fspan><span style=\"font-family:'JetBrains Mono',monospace\">#2A2C28 · 2px<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex; justify-content:space-between; gap:20px; padding:10px 0; border-bottom:1px solid #2A2C28\"><span style=\"color:#B9BFB6\">Headings<\u002Fspan><span style=\"font-family:'JetBrains Mono',monospace\">JetBrains Mono 700<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex; justify-content:space-between; gap:20px; padding:10px 0\"><span style=\"color:#B9BFB6\">Labels<\u002Fspan><span style=\"font-family:'JetBrains Mono',monospace\">Mono 700 · 0.22em · upper<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"margin-top:24px; padding-top:16px; border-top:2px solid #C4161C; font-size:14px; line-height:1.55; color:#B9BFB6\">Field Green does not appear anywhere in DragonEgg, and neither does paper ground — there is no light mode. Printed DragonEgg material prints as ink-on-paper with crimson rules, never as a light reskin.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"display:flex; gap:2px; margin-top:2px; flex-wrap:wrap\">\n      <div style=\"flex:1 1 200px; background:#C4161C; color:#0B0C0A; padding:16px 20px; font-family:'JetBrains Mono',monospace; font-weight:700; font-size:11px; letter-spacing:0.22em; text-transform:uppercase\">Restricted<\u002Fdiv>\n      <div style=\"flex:1 1 200px; background:#101210; color:#F2EFE7; padding:16px 20px; font-family:'JetBrains Mono',monospace; font-weight:700; font-size:11px; letter-spacing:0.22em; text-transform:uppercase; border:2px solid #C4161C\">Unclassified<\u002Fdiv>\n      <div style=\"flex:1 1 200px; background:#101210; color:#8B918A; padding:16px 20px; font-family:'JetBrains Mono',monospace; font-weight:700; font-size:11px; letter-spacing:0.22em; text-transform:uppercase; border:2px solid #2A2C28\">Exercise only<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"font-size:14px; line-height:1.55; max-width:900px; margin-top:16px; color:#8B918A\">Classification and handling banners are a DragonEgg pattern the rest of the suite inherits when it needs one: full-width, mono, 0.22em, no icon, top and bottom of the view. FireCOP, Cambot and DroneCase all carry the authorised-use notice in this form.<\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"padding:64px 48px; border-bottom:2px solid #12211A; background:#0B0C0A; color:#F2F4EE\">\n    <div style=\"font-family:'JetBrains Mono',monospace; font-weight:700; font-size:11px; letter-spacing:0.2em; text-transform:uppercase; color:#9AA08F\">09 — The &amp;kit family<\u002Fdiv>\n    <h2 style=\"font-size:40px; line-height:1.1; font-weight:800; letter-spacing:-0.025em; margin:14px 0 0 0\">A sibling that grew a family of its own<\u002Fh2>\n    <div style=\"font-size:17px; line-height:1.55; max-width:820px; margin-top:18px; color:#B9BFB6\">&amp;kit is not an Arya product and never becomes one. It is open, public and unrestricted, and its bracket device now heads three services that share its posture — a team signs in, works a picture, and signs out. They take the token, the near-black ground and the mono discipline; they take the grid, the type and the voice from the suite.<\u002Fdiv>\n\n    <div style=\"display:flex; flex-wrap:wrap; gap:2px; margin-top:40px; background:#2A2C28; border:2px solid #2A2C28\">\n      <div style=\"background:#101210; padding:32px 28px; min-width:0; flex:1 1 240px\">\n        <div style=\"font-family:'JetBrains Mono',monospace; font-weight:700; font-size:34px; line-height:1\"><span style=\"color:#6E7364\">[<\u002Fspan><span style=\"color:#F2F4EE\">&amp;<\u002Fspan><span style=\"color:#D7FF3F\">k<\u002Fspan><span style=\"color:#6E7364\">]<\u002Fspan><\u002Fdiv>\n        <div style=\"font-size:17px; font-weight:800; margin-top:22px\">&amp;kit<\u002Fdiv>\n        <div style=\"font-size:13.5px; line-height:1.5; color:#B9BFB6; margin-top:8px\">Public mission data, connected. The head of the family and the only one that is open to anyone.<\u002Fdiv>\n        <div style=\"font-family:'JetBrains Mono',monospace; font-size:11.5px; color:#6E7364; margin-top:14px\">#D7FF3F · lime<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background:#101210; padding:32px 28px; min-width:0; flex:1 1 240px\">\n        <div style=\"font-family:'JetBrains Mono',monospace; font-weight:700; font-size:34px; line-height:1\"><span style=\"color:#0E9A94\">[<\u002Fspan><span style=\"color:#F2F4EE\">one<\u002Fspan><span style=\"color:#0E9A94\">]<\u002Fspan><\u002Fdiv>\n        <div style=\"font-size:17px; font-weight:800; margin-top:22px\">OneCOP<\u002Fdiv>\n        <div style=\"font-size:13.5px; line-height:1.5; color:#B9BFB6; margin-top:8px\">The base common operating picture, and the parent of every COP child.<\u002Fdiv>\n        <div style=\"font-family:'JetBrains Mono',monospace; font-size:11.5px; color:#6E7364; margin-top:14px\">#0E9A94 · signal teal<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background:#101210; padding:32px 28px; min-width:0; flex:1 1 240px\">\n        <div style=\"font-family:'JetBrains Mono',monospace; font-weight:700; font-size:34px; line-height:1\"><span style=\"color:#E8A80F\">[<\u002Fspan>🔥<span style=\"color:#E8A80F\">]<\u002Fspan><\u002Fdiv>\n        <div style=\"font-size:17px; font-weight:800; margin-top:22px\">FireCOP<\u002Fdiv>\n        <div style=\"font-size:13.5px; line-height:1.5; color:#B9BFB6; margin-top:8px\">OneCOP tuned for wildland fire. A specialised child, not a separate product.<\u002Fdiv>\n        <div style=\"font-family:'JetBrains Mono',monospace; font-size:11.5px; color:#6E7364; margin-top:14px\">#E8A80F · ember gold<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background:#101210; padding:32px 28px; min-width:0; flex:1 1 240px\">\n        <div style=\"font-family:'JetBrains Mono',monospace; font-weight:700; font-size:30px; line-height:1\"><span style=\"color:#23C48E\">[<\u002Fspan>📷<span style=\"color:#23C48E\">]<\u002Fspan><\u002Fdiv>\n        <div style=\"font-size:17px; font-weight:800; margin-top:22px\">Cambot<\u002Fdiv>\n        <div style=\"font-size:13.5px; line-height:1.5; color:#B9BFB6; margin-top:8px\">Operational camera workspace for participating teams.<\u002Fdiv>\n        <div style=\"font-family:'JetBrains Mono',monospace; font-size:11.5px; color:#6E7364; margin-top:14px\">#23C48E · phosphor<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background:#101210; padding:32px 28px; min-width:0; flex:1 1 240px\">\n        <div style=\"font-family:'JetBrains Mono',monospace; font-weight:700; font-size:34px; line-height:1\"><span style=\"color:#CE2E86\">[<\u002Fspan><svg sc-camel-view-box=\"0 0 100 100\" style=\"height:0.86em; width:0.86em; vertical-align:-0.06em; display:inline-block\"><g stroke=\"#F2F4EE\" stroke-width=\"6\" fill=\"none\"><path d=\"M26 26 L74 74 M74 26 L26 74\"><\u002Fpath><circle cx=\"26\" cy=\"26\" r=\"18\"><\u002Fcircle><circle cx=\"74\" cy=\"26\" r=\"18\"><\u002Fcircle><circle cx=\"26\" cy=\"74\" r=\"18\"><\u002Fcircle><circle cx=\"74\" cy=\"74\" r=\"18\"><\u002Fcircle><\u002Fg><rect x=\"39\" y=\"39\" width=\"22\" height=\"22\" fill=\"#F2F4EE\"><\u002Frect><\u002Fsvg><span style=\"color:#CE2E86\">]<\u002Fspan><\u002Fdiv>\n        <div style=\"font-size:17px; font-weight:800; margin-top:22px\">DroneCase<\u002Fdiv>\n        <div style=\"font-size:13.5px; line-height:1.5; color:#B9BFB6; margin-top:8px\">Restricted case system for drone incidents. Activity may be monitored and recorded.<\u002Fdiv>\n        <div style=\"font-family:'JetBrains Mono',monospace; font-size:11.5px; color:#6E7364; margin-top:14px\">#CE2E86 · magenta<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"background:#101210; padding:32px 28px; margin-top:2px; border:2px solid #2A2C28; border-top:0\">\n      <div style=\"font-family:'JetBrains Mono',monospace; font-weight:700; font-size:10px; letter-spacing:0.2em; text-transform:uppercase; color:#9AA08F\">COP children<\u002Fdiv>\n      <div style=\"display:flex; gap:28px; margin-top:22px; align-items:center; flex-wrap:wrap\">\n        <div style=\"font-family:'JetBrains Mono',monospace; font-weight:700; font-size:30px; line-height:1\"><span style=\"color:#0E9A94\">[<\u002Fspan><span style=\"color:#F2F4EE\">one<\u002Fspan><span style=\"color:#0E9A94\">]<\u002Fspan><\u002Fdiv>\n        <div style=\"font-family:'JetBrains Mono',monospace; font-size:22px; color:#52564A; line-height:1\">→<\u002Fdiv>\n        <div style=\"font-family:'JetBrains Mono',monospace; font-weight:700; font-size:30px; line-height:1\"><span style=\"color:#E8A80F\">[<\u002Fspan>🔥<span style=\"color:#E8A80F\">]<\u002Fspan><\u002Fdiv>\n        <div style=\"font-size:25px; font-weight:800; letter-spacing:-0.03em; line-height:1; color:#F2F4EE\">FireCOP<\u002Fdiv>\n        <div style=\"font-family:'Archivo Narrow',sans-serif; font-weight:600; font-size:10px; letter-spacing:0.18em; text-transform:uppercase; color:#9AA08F; line-height:1.6\">A OneCOP picture<br>for wildland fire<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:flex; flex-wrap:wrap; gap:30px; margin-top:24px\">\n        <div style=\"flex:1 1 250px; font-size:13.5px; line-height:1.55; color:#B9BFB6\"><strong style=\"color:#F2F4EE\">What a child gets.<\u002Fstrong> Its own token, its own accent and its own domain vocabulary. It is a full property with a full lockup — the operator signs into FireCOP, not into OneCOP.<\u002Fdiv>\n        <div style=\"flex:1 1 250px; font-size:13.5px; line-height:1.55; color:#B9BFB6\"><strong style=\"color:#F2F4EE\">What a child inherits.<\u002Fstrong> Every layout, control and map pattern OneCOP defines. A child may add domain layers and drop what it does not need; it may not redraw the picture.<\u002Fdiv>\n        <div style=\"flex:1 1 250px; font-size:13.5px; line-height:1.55; color:#B9BFB6\"><strong style=\"color:#F2F4EE\">How the parentage shows.<\u002Fstrong> One line, Archivo Narrow 600, 10px, 0.18em, under the lockup on sign-in and in the footer: <span style=\"font-family:'JetBrains Mono',monospace; color:#F2F4EE\">A ONECOP PICTURE<\u002Fspan>. Never a second mark, never a co-lockup.<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"font-size:13.5px; line-height:1.55; margin-top:22px; color:#B9BFB6; border-top:2px solid #52564A; padding-top:14px\">The <strong style=\"color:#F2F4EE\">COP<\u002Fstrong> suffix is reserved for children of OneCOP and always sets in caps against a camel-cased domain — FireCOP, and whatever follows it. A service not built on the OneCOP picture does not take the suffix, whatever it does: Cambot and DroneCase are siblings of OneCOP, not children.<\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"display:grid; grid-template-columns:repeat(auto-fit,minmax(min(320px,100%),1fr)); gap:2px; margin-top:2px; background:#2A2C28; border:2px solid #2A2C28; border-top:0\">\n      <div style=\"background:#0B0C0A; padding:28px\">\n        <div style=\"font-family:'JetBrains Mono',monospace; font-size:10px; letter-spacing:0.2em; text-transform:uppercase; color:#D7FF3F\">Shared with the suite<\u002Fdiv>\n        <div style=\"font-size:14px; line-height:1.55; color:#B9BFB6; margin-top:12px\">8px unit · 12 columns · 2px rules · radius 0 · flush left · Archivo for names and prose · JetBrains Mono for machine output · 44px targets · status colours · classification banners · the voice in §10<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background:#0B0C0A; padding:28px\">\n        <div style=\"font-family:'JetBrains Mono',monospace; font-size:10px; letter-spacing:0.2em; text-transform:uppercase; color:#8B918A\">Not shared<\u002Fdiv>\n        <div style=\"font-size:14px; line-height:1.55; color:#B9BFB6; margin-top:12px\">The Signal Block · Field Green · the warm paper and console grounds · Signal Orange · the accent-cell system · the SNSTAC endorsement lockup, which &amp;kit-family services carry as a footer line rather than a lockup<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"display:grid; grid-template-columns:repeat(auto-fit,minmax(300px,1fr)); gap:32px; margin-top:28px; max-width:1100px\">\n      <div style=\"font-size:14px; line-height:1.55; color:#B9BFB6; border-top:2px solid #52564A; padding-top:14px\"><strong style=\"color:#F2F4EE\">Co-presentation.<\u002Fstrong> When a token property appears alongside an Arya property — a data source credit, a joint page — set both lockups on one baseline, separated by a 2px rule, at equal cap height. Neither endorses the other.<\u002Fdiv>\n      <div style=\"font-size:14px; line-height:1.55; color:#B9BFB6; border-top:2px solid #52564A; padding-top:14px\"><strong style=\"color:#F2F4EE\">Never do this.<\u002Fstrong> Do not put the Signal Block inside the brackets. Do not recolour a glyph, or lend one product's brackets to another. Do not use lime anywhere outside &amp;kit's own surfaces.<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"padding:64px 48px; border-bottom:2px solid #12211A\">\n    <div style=\"font-family:'Archivo Narrow',sans-serif; font-weight:600; font-size:11px; letter-spacing:0.16em; text-transform:uppercase; color:#6B7169\">10 — Voice<\u002Fdiv>\n    <h2 style=\"font-size:40px; line-height:1.1; font-weight:800; letter-spacing:-0.025em; margin:14px 0 0 0\">Write like the manual in the case<\u002Fh2>\n    <div style=\"font-size:17px; line-height:1.55; max-width:820px; margin-top:18px; color:#2B342E\">What it does, what it needs, what will go wrong. An operator reading at 2am in a truck is the only audience. This is the Sensors &amp; Signals voice and it does not change between products — only the subject does.<\u002Fdiv>\n\n    <div style=\"display:grid; grid-template-columns:repeat(auto-fit,minmax(min(320px,100%),1fr)); gap:2px; margin-top:36px; background:#12211A; border:2px solid #12211A\">\n      <div style=\"background:#F2EFE7; padding:32px\">\n        <div style=\"font-family:'Archivo Narrow',sans-serif; font-weight:600; font-size:10px; letter-spacing:0.18em; text-transform:uppercase; color:#1D4634\">Say<\u002Fdiv>\n        <div style=\"display:flex; flex-direction:column; gap:12px; margin-top:16px; font-size:15px; line-height:1.5\">\n          <div>Boots on a Raspberry Pi, broadcasts its own Wi-Fi, needs no internet.<\u002Fdiv>\n          <div>Ships with every sensor switched off. On first boot it enables what it finds.<\u002Fdiv>\n          <div>It will tell you when two capabilities want the same radio.<\u002Fdiv>\n          <div>Access is provisioned by invitation.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background:#F2EFE7; padding:32px\">\n        <div style=\"font-family:'Archivo Narrow',sans-serif; font-weight:600; font-size:10px; letter-spacing:0.18em; text-transform:uppercase; color:#A32820\">Don't say<\u002Fdiv>\n        <div style=\"display:flex; flex-direction:column; gap:12px; margin-top:16px; font-size:15px; line-height:1.5; color:#6B7169\">\n          <div>A revolutionary, next-generation situational awareness ecosystem.<\u002Fdiv>\n          <div>Empowering operators to unlock actionable insight.<\u002Fdiv>\n          <div>Seamlessly integrates with your existing workflows.<\u002Fdiv>\n          <div>Contact us to learn more about the exciting possibilities.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"display:flex; flex-wrap:wrap; gap:2px; margin-top:2px; background:#12211A; border:2px solid #12211A; border-top:0\">\n      <div style=\"background:#EAE6DC; padding:22px; flex:1 1 230px; min-width:0\"><div style=\"font-size:14.5px; font-weight:800\">Product names<\u002Fdiv><div style=\"font-size:13.5px; line-height:1.5; color:#2B342E; margin-top:7px\">One word, camel-cased: AryaOS, AryaAir, FireCOP, DroneCase. Never spaced, never all-caps in prose.<\u002Fdiv><\u002Fdiv>\n      <div style=\"background:#EAE6DC; padding:22px; flex:1 1 230px; min-width:0\"><div style=\"font-size:14.5px; font-weight:800\">Numbers<\u002Fdiv><div style=\"font-size:13.5px; line-height:1.5; color:#2B342E; margin-top:7px\">Only if measured. No round-number claims, no percentages without a source.<\u002Fdiv><\u002Fdiv>\n      <div style=\"background:#EAE6DC; padding:22px; flex:1 1 230px; min-width:0\"><div style=\"font-size:14.5px; font-weight:800\">Acronyms<\u002Fdiv><div style=\"font-size:13.5px; line-height:1.5; color:#2B342E; margin-top:7px\">Expand once per page, then use freely. Link to the glossary rather than re-explaining.<\u002Fdiv><\u002Fdiv>\n      <div style=\"background:#EAE6DC; padding:22px; flex:1 1 230px; min-width:0\"><div style=\"font-size:14.5px; font-weight:800\">Restricted surfaces<\u002Fdiv><div style=\"font-size:13.5px; line-height:1.5; color:#2B342E; margin-top:7px\">Sign-in pages state the boundary plainly and carry the authorised-use notice unchanged.<\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"padding:64px 48px; border-bottom:2px solid #12211A; background:#EAE6DC\">\n    <div style=\"font-family:'Archivo Narrow',sans-serif; font-weight:600; font-size:11px; letter-spacing:0.16em; text-transform:uppercase; color:#6B7169\">11 — Tokens, files and handoff<\u002Fdiv>\n    <h2 style=\"font-size:40px; line-height:1.1; font-weight:800; letter-spacing:-0.025em; margin:14px 0 0 0\">One namespace, one theme per property<\u002Fh2>\n\n    <div style=\"display:grid; grid-template-columns:repeat(auto-fit,minmax(min(320px,100%),1fr)); gap:2px; margin-top:36px; background:#12211A; border:2px solid #12211A\">\n      <div style=\"background:#0B1512; padding:32px\">\n        <div style=\"font-family:'Archivo Narrow',sans-serif; font-weight:600; font-size:10px; letter-spacing:0.18em; text-transform:uppercase; color:#8F9A93\">suite.css — shared by every property<\u002Fdiv>\n        <div style=\"font-family:'JetBrains Mono',monospace; font-size:12.5px; line-height:1.9; color:#C9D2CC; margin-top:14px; white-space:pre-wrap; overflow-wrap:anywhere\">:root {\n  --sns-ink:       #12211A;\n  --sns-field:     #1D4634;\n  --sns-console:   #0B1512;\n  --sns-paper:     #F2EFE7;\n  --sns-paper-2:   #EAE6DC;\n  --sns-slate:     #6B7169;\n  --sns-hairline:  #CFCBC0;\n  --sns-kit-ink:   #0B0C0A;\n  --sns-kit-paper: #F2F4EE;\n  --sns-bracket:   #52564A;\n  --sns-ok:        #3F7D57;\n  --sns-warn:      #A8811C;\n  --sns-fault:     #A32820;\n  --sns-unit:      8px;\n  --sns-radius:    0;\n}<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background:#0B1512; padding:32px\">\n        <div style=\"font-family:'Archivo Narrow',sans-serif; font-weight:600; font-size:10px; letter-spacing:0.18em; text-transform:uppercase; color:#8F9A93\">theme.css — one block per property<\u002Fdiv>\n        <div style=\"font-family:'JetBrains Mono',monospace; font-size:12.5px; line-height:1.9; color:#C9D2CC; margin-top:14px; white-space:pre-wrap; overflow-wrap:anywhere\">[data-property=\"aryaos\"] {\n  --sns-accent: #E4610F;\n  --sns-family: arya;\n}\n[data-property=\"aryaair\"]   { #0FA8CE · arya }\n[data-property=\"aryauas\"]   { #7C52E8 · arya }\n[data-property=\"aryasea\"]   { #1F5BD1 · arya }\n[data-property=\"dragonegg\"] { #C4161C · arya }\n[data-property=\"andkit\"]    { #D7FF3F · kit  }\n[data-property=\"firecop\"]   { #E8A80F · kit  }\n[data-property=\"cambot\"]    { #23C48E · kit  }\n[data-property=\"dronecase\"] { #CE2E86 · kit  }\n[data-property=\"onecop\"]    { #0E9A94 · kit  }<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"display:flex; flex-wrap:wrap; gap:2px; margin-top:2px; background:#12211A; border:2px solid #12211A; border-top:0\">\n      <div style=\"background:#F2EFE7; padding:24px 26px; flex:1 1 260px; min-width:0\"><div style=\"font-size:14.5px; font-weight:800\">Never hard-code an accent<\u002Fdiv><div style=\"font-size:14px; line-height:1.5; color:#2B342E; margin-top:8px\">Components read <span style=\"font-family:'JetBrains Mono',monospace; font-size:12.5px\">--sns-accent<\u002Fspan>. Setting <span style=\"font-family:'JetBrains Mono',monospace; font-size:12.5px\">data-property<\u002Fspan> on the root is the whole of theming; <span style=\"font-family:'JetBrains Mono',monospace; font-size:12.5px\">--sns-family<\u002Fspan> switches ground and mark.<\u002Fdiv><\u002Fdiv>\n      <div style=\"background:#F2EFE7; padding:24px 26px; flex:1 1 260px; min-width:0\"><div style=\"font-size:14.5px; font-weight:800\">File naming<\u002Fdiv><div style=\"font-size:14px; line-height:1.5; color:#2B342E; margin-top:8px\"><span style=\"font-family:'JetBrains Mono',monospace; font-size:12.5px\">mark-{property}[-rev].svg<\u002Fspan> for Signal Blocks, <span style=\"font-family:'JetBrains Mono',monospace; font-size:12.5px\">token-{property}[-rev].svg<\u002Fspan> for bracket glyphs. Both live in <span style=\"font-family:'JetBrains Mono',monospace; font-size:12.5px\">suite/<\u002Fspan>.<\u002Fdiv><\u002Fdiv>\n      <div style=\"background:#F2EFE7; padding:24px 26px; flex:1 1 260px; min-width:0\"><div style=\"font-size:14.5px; font-weight:800\">Before it leaves<\u002Fdiv><div style=\"font-size:14px; line-height:1.5; color:#2B342E; margin-top:8px\">Token SVGs are live type and a live emoji. Outline the brackets and convert the glyph to a path before they go to a printer or a third party — an emoji rendered by someone else's font is not the mark.<\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"padding:56px 48px; background:#12211A; color:#F2EFE7\">\n    <div style=\"display:flex; gap:40px; align-items:flex-end; flex-wrap:wrap\">\n      <img src=\"7f64f8f4-01a3-429a-8176-0e5a4c2d1581\" alt=\"\" style=\"width:96px; height:auto; display:block\">\n      <div style=\"flex:1 1 460px\">\n        <div style=\"font-size:26px; font-weight:800; letter-spacing:-0.025em\">Two marks. Two grounds. Ten accents. Nothing else.<\u002Fdiv>\n        <div style=\"font-size:15px; line-height:1.6; color:#A8B2AB; margin-top:10px; max-width:70ch\">If a decision is not covered here, it is probably not a decision — match the nearest example and keep the grid. Where you genuinely need a new rule, add it to this document rather than to one property.<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"font-family:'JetBrains Mono',monospace; font-size:12px; color:#A8B2AB; line-height:1.9; text-align:right\">{{ endorsement }}<br>v1.0 · July 2026<br>info@snstac.com<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;showGrid&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Guide&quot;},&quot;endorsement&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;A SENSORS &amp; SIGNALS PRODUCT&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Guide&quot;}}\">\nclass Component extends DCLogic {\n  renderVals() {\n    return {\n      gridOpacity: (this.props.showGrid ?? true) ? 1 : 0,\n      endorsement: this.props.endorsement ?? \"A SENSORS & SIGNALS PRODUCT\",\n      products: [\n        { name: \"AryaOS\",    family: \"Arya\", accent: \"#E4610F\", accentName: \"Signal Orange\", line: \"The gateway OS. Sensors in, Cursor on Target out.\" },\n        { name: \"AryaAir\",   family: \"Arya\", accent: \"#0FA8CE\", accentName: \"Sky Cyan\",      line: \"ADS-B and UAT aircraft. The original AirTAK case.\" },\n        { name: \"AryaUAS\",   family: \"Arya\", accent: \"#7C52E8\", accentName: \"Signal Violet\", line: \"Remote ID over Wi-Fi and Bluetooth, plus DJI DroneID.\" },\n        { name: \"AryaSea\",   family: \"Arya\", accent: \"#1F5BD1\", accentName: \"Marine Blue\",   line: \"AIS vessels, over the air or from an online feed.\" },\n        { name: \"DragonEgg\", family: \"Arya\", accent: \"#C4161C\", accentName: \"Crimson\",       line: \"Red team. Adversary emulation and RF effects.\" },\n        { name: \"&kit\",      family: \"&kit\", accent: \"#D7FF3F\", accentName: \"Lime\",          line: \"Public mission data, connected. Open to anyone.\" },\n        { name: \"OneCOP\",    family: \"&kit\", accent: \"#0E9A94\", accentName: \"Signal Teal\",   line: \"The base common operating picture. Every COP child is this, tuned.\" },\n        { name: \"FireCOP\",   family: \"&kit\", accent: \"#E8A80F\", accentName: \"Ember Gold\",    line: \"OneCOP for wildland fire. A specialised child, not a separate product.\" },\n        { name: \"Cambot\",    family: \"&kit\", accent: \"#23C48E\", accentName: \"Phosphor\",      line: \"Operational camera workspace for participating teams.\" },\n        { name: \"DroneCase\", family: \"&kit\", accent: \"#CE2E86\", accentName: \"Magenta\",       line: \"Restricted case system for drone incidents and evidence.\" }\n      ]\n    };\n  }\n}\n\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
