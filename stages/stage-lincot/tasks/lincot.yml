- name: Install AryaOS LINCOT defaults
  ansible.builtin.template:
    src: lincot.default.j2
    dest: /etc/default/lincot
    mode: "0644"
  notify: Restart Lincot

- name: Keep AryaOS LINCOT environment across package upgrades
  ansible.builtin.copy:
    src: "{{ shared_files }}/lincot/systemd/lincot.service.d/aryaos-config.conf"
    dest: /etc/systemd/system/lincot.service.d/aryaos-config.conf
    mode: "0644"
  notify: Restart Lincot

- name: Allow LINCOT to read Raspberry Pi throttle state
  ansible.builtin.user:
    name: lincot
    groups: video
    append: true
  notify: Restart Lincot

- name: Enable and start LINCOT
  ansible.builtin.systemd:
    name: lincot.service
    enabled: true
    state: started
    daemon_reload: true
