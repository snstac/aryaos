- name: Copy reset_wlan.sh to /usr/local/sbin
  ansible.builtin.copy:
    src: "{{ shared_files }}/dronecot/reset_wlan.sh"
    dest: /usr/local/sbin/
    mode: "0755"

- name: Copy aryaos-dronecot-ready to /usr/local/sbin
  ansible.builtin.copy:
    src: "{{ shared_files }}/dronecot/aryaos-dronecot-ready"
    dest: /usr/local/sbin/
    mode: "0755"

- name: Install the explicitly named DJI DroneCOT unit
  ansible.builtin.copy:
    src: "{{ shared_files }}/aryaos/systemd/dronecot-dji.service"
    dest: /etc/systemd/system/dronecot-dji.service
    mode: "0644"
  notify: Reload systemd

- name: Install DJI DroneCOT defaults
  ansible.builtin.copy:
    src: "{{ shared_files }}/aryaos/dronecot-dji.default"
    dest: /etc/default/dronecot-dji
    mode: "0644"

- name: Disable the ambiguous upstream generic DroneCOT unit
  ansible.builtin.systemd:
    name: dronecot.service
    enabled: false
    masked: true
  notify: Reload systemd
