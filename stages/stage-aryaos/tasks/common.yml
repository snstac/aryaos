- name: Copy sudoers
  ansible.builtin.copy:
    src: "{{ shared_files }}/aryaos/aryaos.sudoers"
    dest: /etc/sudoers.d/aryaos
    mode: "0440"

# Create the directory /etc/aryaos/
- name: Create AryaOS Directory
  ansible.builtin.file:
    path: /etc/aryaos
    state: directory
    mode: "0755"

# Copy the AryaOS config file to /etc/aryaos/
- name: Upload AryaOS Config
  ansible.builtin.copy:
    src: "{{ shared_files }}/aryaos/aryaos-config.txt"
    dest: /etc/aryaos/
    mode: "0644"

# Copy README-aryaos.txt to /
- name: Upload AryaOS README
  ansible.builtin.copy:
    src: "{{ shared_files }}/aryaos/README-aryaos.txt"
    dest: /
    mode: "0644"

# Copy the AryaOS banner files to /etc
- name: Upload AryaOS Banner
  ansible.builtin.copy:
    src: "{{ shared_files }}/aryaos/{{ item }}"
    dest: /etc/
    mode: "0644"
  loop: "{{ ['issue.net', 'issue', 'motd', 'aryaos-version', 'aryaos-release'] }}"


# Copy get_throttled.sh" to /usr/local/sbin/
- name: Upload get_throttled.sh
  ansible.builtin.copy:
    src: "{{ shared_files }}/aryaos/get_throttled.sh"
    dest: /usr/local/sbin/
    mode: "0755"

- name: Upload TAK data package importer
  ansible.builtin.copy:
    src: "{{ shared_files }}/aryaos/aryaos-import-tak-dp"
    dest: /usr/local/sbin/aryaos-import-tak-dp
    mode: "0755"

- name: Upload authenticated TAK import frontend
  ansible.builtin.copy:
    src: "{{ shared_files }}/aryaos/aryaos-tak-dp-import"
    dest: /usr/local/sbin/aryaos-tak-dp-import
    mode: "0755"

- name: Upload TAK data package import daemon
  ansible.builtin.copy:
    src: "{{ shared_files }}/aryaos/aryaos-tak-dp-importd"
    dest: /usr/local/sbin/aryaos-tak-dp-importd
    mode: "0755"

- name: Upload site output helper
  ansible.builtin.copy:
    src: "{{ shared_files }}/aryaos/aryaos-site-output"
    dest: /usr/local/sbin/aryaos-site-output
    mode: "0755"

- name: Upload health aggregation helper
  ansible.builtin.copy:
    src: "{{ shared_files }}/aryaos/aryaos-health"
    dest: /usr/local/sbin/aryaos-health
    mode: "0755"

- name: Upload AryaOS CoT identity and remarks helpers
  ansible.builtin.copy:
    src: "{{ shared_files }}/aryaos/{{ item }}"
    dest: "/usr/local/sbin/{{ item }}"
    mode: "0755"
  loop:
    - aryaos-cot-detail
    - aryaos-lincot-remarks

- name: Ensure GutCheck systemd drop-in directory exists
  ansible.builtin.file:
    path: /etc/systemd/system/gutcheck.service.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Install AryaOS GutCheck health and tactical discovery integration
  ansible.builtin.copy:
    src: "{{ shared_files }}/aryaos/systemd/gutcheck.service.d/aryaos-health.conf"
    dest: /etc/systemd/system/gutcheck.service.d/aryaos-health.conf
    owner: root
    group: root
    mode: "0644"
  notify:
    - Reload systemd
    - Restart GutCheck

- name: Install scoped GutCheck health collector sudo policy
  ansible.builtin.copy:
    src: "{{ shared_files }}/aryaos/aryaos-gutcheck-health.sudoers"
    dest: /etc/sudoers.d/aryaos-gutcheck-health
    owner: root
    group: root
    mode: "0440"
  notify: Restart GutCheck

- name: Upload resilient time and deferred TLS helpers
  ansible.builtin.copy:
    src: "{{ shared_files }}/aryaos/{{ item }}"
    dest: "/usr/local/sbin/{{ item }}"
    mode: "0755"
  loop:
    - aryaos-time-bootstrap
    - aryaos-web-tls-init

- name: Install TAK data package import daemon unit
  ansible.builtin.copy:
    src: "{{ shared_files }}/aryaos/systemd/aryaos-tak-dp-importd.service"
    dest: /etc/systemd/system/aryaos-tak-dp-importd.service
    mode: "0644"
  notify: Reload systemd

- name: Install resilient time systemd units
  ansible.builtin.copy:
    src: "{{ shared_files }}/aryaos/systemd/{{ item }}"
    dest: "/etc/systemd/system/{{ item }}"
    mode: "0644"
  loop:
    - aryaos-ipv4ll-apply.service
    - aryaos-time-floor.service
    - aryaos-time-bootstrap.service
    - aryaos-time-ready.target
    - aryaos-time-refresh.service
    - aryaos-time-refresh.path
    - aryaos-time-refresh.timer
    - aryaos-web-tls-init.service
  notify: Reload systemd

- name: Install AryaOS chrony policy
  ansible.builtin.copy:
    src: "{{ shared_files }}/aryaos/chrony/aryaos.conf"
    dest: /etc/chrony/conf.d/aryaos.conf
    mode: "0644"
  notify: Restart chrony

- name: Enable and start TAK data package import daemon
  ansible.builtin.systemd:
    name: aryaos-tak-dp-importd.service
    enabled: true
    state: started
    daemon_reload: true

- name: Ensure gpsd system group (socket group for gpspipe / portal CGI)
  ansible.builtin.group:
    name: gpsd
    system: true
    state: present

- name: Ensure appliance service drop-in directories exist
  ansible.builtin.file:
    path: "/etc/systemd/system/{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - gpsd.socket.d
    - bluetooth.service.d

- name: Install gpsd.socket drop-in (0660 root:gpsd; default unit is 0600 root-only)
  ansible.builtin.copy:
    src: "{{ shared_files }}/aryaos/systemd/gpsd.socket.d/socket-group.conf"
    dest: /etc/systemd/system/gpsd.socket.d/socket-group.conf
    owner: root
    group: root
    mode: "0644"
  notify: Restart gpsd

- name: Install AryaOS gpsd defaults (USB ttyUSB + ttyACM, USBAUTO, -n)
  ansible.builtin.copy:
    src: "{{ shared_files }}/aryaos/gpsd.default"
    dest: /etc/default/gpsd
    owner: root
    group: root
    mode: "0644"
    backup: true
    force: "{{ aryaos_force_gpsd_default | default(false) | bool }}"
  notify: Restart gpsd

- name: Match BlueZ configuration-directory mode to the packaged directory
  ansible.builtin.copy:
    src: "{{ shared_files }}/aryaos/systemd/bluetooth.service.d/aryaos-directory-mode.conf"
    dest: /etc/systemd/system/bluetooth.service.d/aryaos-directory-mode.conf
    owner: root
    group: root
    mode: "0644"
  notify: Reload systemd

- name: Suppress unavailable optional kTLS module on Raspberry Pi kernels
  ansible.builtin.copy:
    src: "{{ shared_files }}/aryaos/modules-load.d/lighttpd-mod-openssl.conf"
    dest: /etc/modules-load.d/lighttpd-mod-openssl.conf
    owner: root
    group: root
    mode: "0644"

- name: Ensure www-data can use gpspipe (gpsd socket group)
  ansible.builtin.user:
    name: www-data
    groups: gpsd
    append: true
  notify: Restart lighttpd

- name: Ensure www-data can run vcgencmd (Raspberry Pi video group)
  ansible.builtin.user:
    name: www-data
    groups: video
    append: true
  notify: Restart lighttpd

- name: Enable gpsd at boot
  ansible.builtin.systemd:
    name: gpsd.service
    enabled: true
    daemon_reload: true

- name: Enable resilient time units at boot
  ansible.builtin.systemd:
    name: "{{ item }}"
    enabled: true
    daemon_reload: true
  loop:
    - aryaos-ipv4ll-apply.service
    - aryaos-time-floor.service
    - aryaos-time-bootstrap.service
    - aryaos-time-ready.target
    - aryaos-time-refresh.timer
    - aryaos-web-tls-init.service

- name: Disable storm-prone event-driven time refresh
  ansible.builtin.systemd:
    name: aryaos-time-refresh.path
    enabled: false
    state: stopped
    daemon_reload: true
  failed_when: false

- name: Disable legacy direct GPS clock writer
  ansible.builtin.systemd:
    name: aryaos-gps-time-sync.service
    enabled: false
    state: stopped
  failed_when: false
