- name: Copy modified NetworkManager
  ansible.builtin.copy:
    src: "{{ shared_files }}/aryaos/NetworkManager.py"
    dest: /usr/lib/python3/dist-packages/NetworkManager.py
    mode: "0644"

- name: Ensure NetworkManager system connection directory exists
  ansible.builtin.file:
    path: /etc/NetworkManager/system-connections
    state: directory
    mode: "0755"

- name: Check for an existing eth1 connection profile
  ansible.builtin.command: nmcli -t -f connection.interface-name connection show
  register: aryaos_existing_nm_interfaces
  changed_when: false
  failed_when: false

- name: Install ANTSDR static Ethernet connection when eth1 is unconfigured
  ansible.builtin.copy:
    src: "{{ shared_files }}/aryaos/NetworkManager/system-connections/aryaos-antsdr.nmconnection"
    dest: /etc/NetworkManager/system-connections/aryaos-antsdr.nmconnection
    mode: "0600"
  when: >-
    aryaos_force_antsdr_connection | default(false) | bool
    or 'eth1' not in aryaos_existing_nm_interfaces.stdout_lines

- name: Ensure NetworkManager drop-in directory exists
  ansible.builtin.file:
    path: /etc/NetworkManager/conf.d
    state: directory
    mode: "0755"

- name: Enable optional IPv4LL fallback for ordinary Ethernet profiles
  ansible.builtin.copy:
    src: "{{ shared_files }}/aryaos/NetworkManager/conf.d/90-aryaos-ipv4ll.conf"
    dest: /etc/NetworkManager/conf.d/90-aryaos-ipv4ll.conf
    mode: "0644"

- name: Install IPv4LL and multicast-link helpers
  ansible.builtin.copy:
    src: "{{ shared_files }}/aryaos/{{ item }}"
    dest: "/usr/local/sbin/{{ item }}"
    mode: "0755"
  loop:
    - aryaos-ipv4ll
    - aryaos-multicast-links

- name: Install multicast-link resolver unit
  ansible.builtin.copy:
    src: "{{ shared_files }}/aryaos/systemd/aryaos-multicast-links.service"
    dest: /etc/systemd/system/aryaos-multicast-links.service
    mode: "0644"

- name: Enable multicast-link resolver
  ansible.builtin.systemd:
    name: aryaos-multicast-links.service
    enabled: true
    daemon_reload: true

- name: Fix comitup port
  ansible.builtin.lineinfile:
    path: /usr/share/comitup/web/comitupweb.py
    regexp: 'port=80'
    line: 'port=9080'

# Change the default port for the comitup web server to 9080 (main branch)
- name: Change comitup port (main branch)
  ansible.builtin.lineinfile:
    path: /usr/share/comitup/web/comitupweb.py
    regexp: 'SERVER_PORT = 80'
    line: 'SERVER_PORT = 9080'

- name: Copy comitup configs
  ansible.builtin.copy:
    src: "{{ shared_files }}/aryaos/comitup.conf"
    dest: /etc
    mode: "0644"

# Bluetooth PAN has a second, interface-pinned dnsmasq. Without dynamic
# binding, Comitup's instance claims UDP/67 globally (or fails if PAN won the
# race), leaving one onboarding transport without DHCP.
- name: Remove incompatible static dnsmasq binding from Comitup
  ansible.builtin.lineinfile:
    path: "{{ item }}"
    regexp: '^bind-interfaces$'
    state: absent
  loop:
    - /usr/share/comitup/dns/dns-hotspot.conf
    - /usr/share/comitup/dns/dns-connected.conf

- name: Isolate Comitup dnsmasq to the Wi-Fi interface
  ansible.builtin.lineinfile:
    path: "{{ item }}"
    line: bind-dynamic
    state: present
  loop:
    - /usr/share/comitup/dns/dns-hotspot.conf
    - /usr/share/comitup/dns/dns-connected.conf

- name: Copy comitup script
  ansible.builtin.copy:
    src: "{{ shared_files }}/aryaos/run_comitup.sh"
    dest: /usr/local/sbin/
    mode: "0755"

- name: Copy comitup callback
  ansible.builtin.copy:
    src: "{{ shared_files }}/aryaos/comitup-callback.sh"
    dest: /usr/local/sbin/
    mode: "0755"

- name: Copy comitup service
  ansible.builtin.copy:
    src: "{{ shared_files }}/aryaos/comitup.service"
    dest: /lib/systemd/system/
    mode: "0644"

- name: Copy comitup json
  ansible.builtin.copy:
    src: "{{ shared_files }}/aryaos/comitup.json"
    dest: /var/lib/comitup/
    mode: "0644"

- name: Copy wifi nuke
  ansible.builtin.copy:
    src: "{{ shared_files }}/aryaos/wifi-nuke.py"
    dest: /usr/local/sbin/
    mode: "0755"

# Remove the string ;http://blank.org/ from the connect.html file.
- name: Remove blank.org from connect.html
  ansible.builtin.lineinfile:
    path: /usr/share/comitup/web/templates/connect.html
    regexp: ';http://blank.org/'
    line: ''

- name: Upload AryaOS Config
  ansible.builtin.copy:
    src: "{{ shared_files }}/aryaos/99-aryaos-dispatcher"
    dest: /etc/NetworkManager/dispatcher.d/
    mode: "0755"
