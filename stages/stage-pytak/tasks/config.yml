# The upstream adsbcot package has historically shipped an aiscot-derived
# defaults file with FEED_URL commented out. Configure the appliance's stable
# decoder JSON path here as well as in stage-adsbcot so an existing-host install
# receives a complete baseline even when no ADS-B hardware role is selected.
- name: Configure ADSBCOT decoder feed
  ansible.builtin.lineinfile:
    path: /etc/default/adsbcot
    regexp: '^#?\s*FEED_URL='
    line: 'FEED_URL=file:///run/adsb/aircraft.json'
    create: true
    mode: "0644"

# Add the line EnvironmentFile=/etc/aryaos/aryaos-config.txt to /lib/systemd/system/aiscot.service if the line does not already exist
- name: Add EnvironmentFile to aiscot.service
  ansible.builtin.lineinfile:
    path: /lib/systemd/system/aiscot.service
    line: 'EnvironmentFile=/etc/aryaos/aryaos-config.txt'
    insertbefore: '^EnvironmentFile=/etc/default/aiscot'

# Add the line EnvironmentFile=/etc/aryaos/aryaos-config.txt to /lib/systemd/system/adsbcot.service if the line does not already exist
- name: Add EnvironmentFile to adsbcot.service
  ansible.builtin.lineinfile:
    path: /lib/systemd/system/adsbcot.service
    line: 'EnvironmentFile=/etc/aryaos/aryaos-config.txt'
    insertbefore: '^EnvironmentFile=/etc/default/adsbcot'

# Add the line EnvironmentFile=/etc/aryaos/aryaos-config.txt to /lib/systemd/system/lincot.service if the line does not already exist
- name: Add EnvironmentFile to lincot.service
  ansible.builtin.lineinfile:
    path: /lib/systemd/system/lincot.service
    line: 'EnvironmentFile=/etc/aryaos/aryaos-config.txt'
    insertbefore: '^EnvironmentFile=/etc/default/lincot'

- name: Ensure sikw00fcot service override directory exists
  ansible.builtin.file:
    path: /etc/systemd/system/sikw00fcot.service.d
    state: directory
    mode: "0755"

- name: Keep sikw00fcot environment ordering across package upgrades
  ansible.builtin.copy:
    src: "{{ shared_files }}/cotbridge/systemd/sikw00fcot.service.d/aryaos-config.conf"
    dest: /etc/systemd/system/sikw00fcot.service.d/aryaos-config.conf
    mode: "0644"

- name: Check for legacy aircot.service
  ansible.builtin.stat:
    path: /lib/systemd/system/aircot.service
  register: aryaos_aircot_service

# Add the line EnvironmentFile=/etc/aryaos/aryaos-config.txt to /lib/systemd/system/aircot.service if the line does not already exist
- name: Add EnvironmentFile to aircot.service
  ansible.builtin.lineinfile:
    path: /lib/systemd/system/aircot.service
    line: 'EnvironmentFile=/etc/aryaos/aryaos-config.txt'
    insertbefore: '^EnvironmentFile=/etc/default/aircot'
  when: aryaos_aircot_service.stat.exists
