# code: language=ansible
# COTBridge CoT hub — bridge config, systemd ordering, feeder EnvironmentFile.
#
# SPDX-License-Identifier: Apache-2.0
# Copyright Sensors & Signals LLC https://www.snstac.com/

- name: Install COTBridge bridge configuration
  ansible.builtin.template:
    src: cotbridge.ini.j2
    dest: /etc/cotbridge.ini
    mode: "0644"
  notify: Restart COTBridge

- name: Ensure cotbridge.service.d exists
  ansible.builtin.file:
    path: /etc/systemd/system/cotbridge.service.d
    state: directory
    mode: "0755"

- name: COTBridge reads PyTAK multicast bind from aryaos-config
  ansible.builtin.copy:
    src: "{{ shared_files }}/cotbridge/systemd/cotbridge.service.d/aryaos-config.conf"
    dest: /etc/systemd/system/cotbridge.service.d/aryaos-config.conf
    mode: "0644"
  notify:
    - Reload systemd
    - Restart COTBridge

- name: Add EnvironmentFile to adsbcot.service
  ansible.builtin.lineinfile:
    path: /lib/systemd/system/adsbcot.service
    line: 'EnvironmentFile=/etc/aryaos/aryaos-config.txt'
    insertbefore: '^EnvironmentFile=/etc/default/adsbcot'
  notify: Reload systemd

- name: Add EnvironmentFile to aiscot.service
  ansible.builtin.lineinfile:
    path: /lib/systemd/system/aiscot.service
    line: 'EnvironmentFile=/etc/aryaos/aryaos-config.txt'
    insertbefore: '^EnvironmentFile=/etc/default/aiscot'
  notify: Reload systemd

- name: Ensure sikw00fcot service override directory exists
  ansible.builtin.file:
    path: /etc/systemd/system/sikw00fcot.service.d
    state: directory
    mode: "0755"

- name: Keep sikw00fcot environment ordering across package upgrades
  ansible.builtin.copy:
    src: "{{ shared_files }}/cotbridge/systemd/sikw00fcot.service.d/aryaos-config.conf"
    dest: /etc/systemd/system/sikw00fcot.service.d/aryaos-config.conf
    mode: "0644"
  notify: Reload systemd

- name: Add EnvironmentFile to lincot.service
  ansible.builtin.lineinfile:
    path: /lib/systemd/system/lincot.service
    line: 'EnvironmentFile=/etc/aryaos/aryaos-config.txt'
    insertbefore: '^EnvironmentFile=/etc/default/lincot'
  notify: Reload systemd

- name: Add EnvironmentFile to aircot.service
  ansible.builtin.lineinfile:
    path: /lib/systemd/system/aircot.service
    line: 'EnvironmentFile=/etc/aryaos/aryaos-config.txt'
    insertbefore: '^EnvironmentFile=/etc/default/aircot'
  notify: Reload systemd

- name: Feeder units start after COTBridge
  ansible.builtin.file:
    path: "/etc/systemd/system/{{ item }}.service.d"
    state: directory
    mode: "0755"
  loop:
    - adsbcot
    - aiscot
    - dronecot-dji
    - sikw00fcot
    - lincot
    - aircot

- name: Install after-cotbridge drop-ins for feeders
  ansible.builtin.copy:
    src: "{{ shared_files }}/cotbridge/systemd/after-cotbridge.conf"
    dest: "/etc/systemd/system/{{ item }}.service.d/after-cotbridge.conf"
    mode: "0644"
  loop:
    - adsbcot
    - aiscot
    - dronecot-dji
    - sikw00fcot
    - lincot
    - aircot
  notify: Reload systemd

- name: Enable and start COTBridge
  ansible.builtin.systemd:
    name: cotbridge.service
    enabled: true
    state: started
    daemon_reload: true

- name: Verify cockpit-cotbridge manifest exists
  ansible.builtin.stat:
    path: /usr/share/cockpit/cotbridge/manifest.json
  register: cockpit_cotbridge_manifest
  failed_when: false
